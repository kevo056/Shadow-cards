<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Story Forge • Mermaid Card Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#263f52,#071019 75%);color:#eef6ff;font:16px system-ui,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}.wrap{width:min(100%,560px);padding:20px;text-align:center}h1{font-size:21px;margin:0 0 8px}p{font-size:13px;opacity:.8}.stage{perspective:850px;touch-action:none;padding:22px 0}.card{width:min(78vw,330px);aspect-ratio:2/3;position:relative;margin:auto;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-radius:14px;box-shadow:0 25px 40px #0009;will-change:transform;overflow:hidden;touch-action:none}.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.foil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--angle,125deg),transparent 18%,rgba(255,225,139,.05) 33%,rgba(255,245,178,.31) 47%,rgba(255,218,116,.06) 56%,transparent 75%);mix-blend-mode:screen;opacity:var(--glow,.45)}.card:after{content:"";position:absolute;inset:0;pointer-events:none;border:2px solid #d7aa51;border-radius:14px;box-shadow:inset 0 0 16px #ffe8a436}.controls{margin:14px auto 0;max-width:340px;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:67%;accent-color:#d5b16e}button{border:1px solid #c6a66b;background:#152a36;color:white;border-radius:9px;padding:9px 18px;margin-top:10px}.missing{padding:8px;color:#ffca9b;font-size:13px}</style></head><body><main class="wrap"><h1>Mermaid Card • 3D Touch Test</h1><p>Drag the card or move the sliders. Gold reflection follows the tilt.</p><div class="stage" id="stage"><div class="card" id="card"><img src="./approved_original_mermaid.png" alt="Approved Story Forge mermaid card" id="art"><div class="foil"></div></div></div><div id="missing" class="missing" hidden>Artwork not uploaded yet: approved_original_mermaid.png</div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status" aria-live="polite">Tilt: 0° / 0°</p></main><script>
(()=>{const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');let down=false;function update(){const x=+v.value,y=+h.value;card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--angle',(125+y*2-x)+'deg');card.style.setProperty('--glow',String(.45+(Math.abs(x)+Math.abs(y))/95));status.textContent='Tilt: '+x+'° / '+y+'°'}function move(e){if(!down)return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.value=Math.round(Math.max(-22,Math.min(22,x*44)));v.value=Math.round(Math.max(-22,Math.min(22,-y*44)));update()}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);move(e)});stage.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=0;h.value=0;update()});document.getElementById('art').addEventListener('error',()=>{document.getElementById('missing').hidden=false});update()})();
</script></body></html>
