<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Story Forge • Mermaid Card Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#263f52,#071019 75%);color:#eef6ff;font:16px system-ui,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}.wrap{width:min(100%,560px);padding:20px;text-align:center}h1{font-size:21px;margin:0 0 8px}p{font-size:13px;opacity:.8}.stage{perspective:850px;touch-action:none;padding:22px 0}.card{width:min(78vw,330px);aspect-ratio:2/3;position:relative;margin:auto;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-radius:14px;box-shadow:0 25px 40px #0009;will-change:transform;overflow:hidden;touch-action:none}.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.foil{position:absolute;inset:0;pointer-events:none;background:
linear-gradient(var(--angle,125deg),transparent 0%,rgba(255,209,88,.14) 18%,rgba(255,236,145,.52) 31%,rgba(255,255,238,1) 39%,rgba(255,225,130,.42) 48%,transparent 55%),
linear-gradient(calc(var(--angle,125deg) + 88deg),transparent 0%,rgba(255,207,77,.24) 28%,rgba(255,248,188,.76) 43%,rgba(255,255,246,1) 50%,rgba(255,220,106,.58) 57%,transparent 75%),
repeating-linear-gradient(calc(var(--angle,125deg) + 24deg),transparent 0%,transparent 7.65%,rgba(255,248,209,.32) 7.84%,rgba(255,255,247,.98) 7.96%,rgba(255,238,167,.25) 8.18%,transparent 8.42%,transparent 16%);mix-blend-mode:screen;opacity:var(--glow,1);-webkit-mask-size:100% 100%;mask-size:100% 100%}.holo{position:absolute;inset:0;pointer-events:none;opacity:.9;mix-blend-mode:screen;background:linear-gradient(var(--holo-angle,110deg),transparent 0%,rgba(67,238,255,.20) 18%,rgba(91,105,255,.52) 34%,rgba(255,93,225,.62) 48%,rgba(74,239,219,.55) 62%,rgba(111,149,255,.29) 77%,transparent 100%),repeating-linear-gradient(calc(var(--holo-angle,110deg) + 65deg),transparent 0%,rgba(135,255,248,.12) 5%,transparent 11%);-webkit-mask-size:100% 100%;mask-size:100% 100%}.depth-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform:translate3d(var(--bg-x,0px),var(--bg-y,0px),0) scale(1.035)}.depth-mermaid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:translate3d(var(--fg-x,0px),var(--fg-y,0px),0) scale(1.018);filter:drop-shadow(var(--shadow-x,1px) var(--shadow-y,3px) 3px rgba(0,4,18,.6))}.card:after{content:"";position:absolute;inset:0;pointer-events:none;border:2px solid #d7aa51;border-radius:14px;box-shadow:inset 0 0 16px #ffe8a436}.controls{margin:14px auto 0;max-width:340px;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:67%;accent-color:#d5b16e}button{border:1px solid #c6a66b;background:#152a36;color:white;border-radius:9px;padding:9px 18px;margin-top:10px}.missing{padding:8px;color:#ffca9b;font-size:13px}</style></head><body><main class="wrap"><h1>Mermaid Card • Mermaid Layer Separation Test v14</h1><p>Drag the card or move the sliders. v14 experiment: separate mermaid and ocean depth; v11 remains the safe baseline.</p><div class="stage" id="stage"><div class="card" id="card"><img src="./approved_original_mermaid.png" alt="Approved Story Forge mermaid card" id="art"><canvas class="depth-bg" id="depth-bg" hidden></canvas><canvas class="depth-mermaid" id="depth-mermaid" hidden></canvas><div class="holo"></div><div class="foil"></div></div></div><div id="missing" class="missing" hidden>Artwork not uploaded yet: approved_original_mermaid.png</div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status" aria-live="polite">Tilt: 0° / 0°</p></main><script>
(()=>{const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');let down=false;function update(){const x=+v.value,y=+h.value;card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--angle',(90+y*3.6-x*2.1)+'deg');card.style.setProperty('--holo-angle',(115-y*4+x*2.5)+'deg');card.style.setProperty('--bg-x',(-y*.24)+'px');card.style.setProperty('--bg-y',(x*.24)+'px');card.style.setProperty('--fg-x',(y*.42)+'px');card.style.setProperty('--fg-y',(-x*.42)+'px');card.style.setProperty('--shadow-x',(-y*.16)+'px');card.style.setProperty('--shadow-y',(3+x*.16)+'px');card.style.setProperty('--left-y',(50-x*1.65+y*.6)+'%');card.style.setProperty('--right-y',(50+x*1.65-y*.6)+'%');card.style.setProperty('--left-x',(8+y*.34)+'%');card.style.setProperty('--right-x',(92+y*.34)+'%');card.style.setProperty('--glow',String(1));status.textContent='Tilt: '+x+'° / '+y+'°'}function move(e){if(!down)return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.value=Math.round(Math.max(-22,Math.min(22,x*44)));v.value=Math.round(Math.max(-22,Math.min(22,-y*44)));update()}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);move(e)});stage.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=0;h.value=0;update()});const art=document.getElementById('art'),foil=card.querySelector('.foil');
function buildGoldMask(){
 // Image-derived ornament mask: only warm metallic pixels in the perimeter.
 // Preserve the original PNG unchanged; generate an alpha mask in memory.
 try{
  const canvas=document.createElement('canvas');
  const w=384,h=576;canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(art,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2];
   const edge=(x<65||x>w-66||y<62||y>h-63);
   const warmth=r-g,blueGap=g-b;
   const metallic=edge&&r>74&&g>43&&warmth>9&&blueGap>9&&r>b*1.35;
   const fineDetail=Math.min(1,Math.max(0,(r-g-9)/42));
   const strength=metallic?Math.min(255,Math.max(110,(r-50)*4.3+fineDetail*28)):0;
   d[i]=255;d[i+1]=255;d[i+2]=255;d[i+3]=strength;
  }
  ctx.putImageData(img,0,0);
  const url='url("'+canvas.toDataURL('image/png')+'")';
  foil.style.webkitMaskImage=url;foil.style.maskImage=url;
  foil.style.webkitMaskComposite='source-over';foil.style.maskComposite='add';
  foil.style.webkitMaskSize='100% 100%';foil.style.maskSize='100% 100%';
 }catch(e){
  // Safari fallback: keep the known-working frame-only shine.
  const edge='linear-gradient(to right,black 0 13%,transparent 13% 87%,black 87% 100%)';
  const ends='linear-gradient(to bottom,black 0 10%,transparent 10% 90%,black 90% 100%)';
  foil.style.webkitMaskImage=edge+','+ends;foil.style.maskImage=edge+','+ends;
  foil.style.webkitMaskComposite='source-over';foil.style.maskComposite='add';
 }
}
function buildOceanMask(){
 const holo=card.querySelector('.holo');
 try{
  const c=document.createElement('canvas');const w=384,h=576;c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(art,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h),p=data.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2];
   // Exclude ornate outer frame, warm gold, gemstones and dark central silhouette.
   const inside=x>60&&x<w-60&&y>64&&y<h-64;
   const cool=b>r*1.12&&g>r*.94;
   const bright=Math.max(r,g,b);
   const darkFigure=bright<72;
   const amount=inside&&cool&&!darkFigure?Math.min(220,Math.max(0,(bright-65)*2.1)):0;
   p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=amount;
  }
  ctx.putImageData(data,0,0);
  const mask='url("'+c.toDataURL('image/png')+'")';
  holo.style.webkitMaskImage=mask;holo.style.maskImage=mask;
 }catch(e){holo.style.display='none';console.warn('Ocean hologram mask unavailable',e);}
}
function buildSeparatedLayers(){
 // Approximate cutout from original pixels, not generated art.
 // Low-res inpainting fills the old silhouette location before parallax.
 try{
  const w=256,h=384,src=document.createElement('canvas');src.width=w;src.height=h;
  const sc=src.getContext('2d',{willReadFrequently:true});sc.drawImage(art,0,0,w,h);
  const original=sc.getImageData(0,0,w,h),p=original.data;
  const mask=new Uint8Array(w*h);
  // Focus on central mermaid area, excluding frame, seaweed and ruins.
  // The mask is deliberately conservative to avoid moving other dark scenery.
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2];
   const nx=x/w,ny=y/h,dx=(nx-.48)/.35,dy=(ny-.53)/.39;
   const region=dx*dx+dy*dy<1.15 && x>39&&x<w-39&&y>50&&y<h-40;
   const darkness=Math.max(r,g,b);
   mask[y*w+x]=region&&darkness<67&&b<g*1.7?1:0;
  }
  // Keep cutout pixels from the approved image, alpha outside silhouette.
  const fg=document.getElementById('depth-mermaid');fg.width=w;fg.height=h;
  const fc=fg.getContext('2d'),fp=fc.createImageData(w,h);fp.data.set(p);
  for(let i=0;i<w*h;i++)fp.data[i*4+3]=mask[i]?255:0;
  fc.putImageData(fp,0,0);
  // Replace silhouette with nearby ocean pixels. Work at low resolution.
  // BFS assigns nearest non-silhouette color, then smooths the filled area.
  const filled=new Uint8ClampedArray(p),dist=new Int32Array(w*h);dist.fill(-1);
  const queue=new Int32Array(w*h);let head=0,tail=0;
  for(let i=0;i<w*h;i++)if(!mask[i]){dist[i]=0;queue[tail++]=i;}
  while(head<tail){
   const i=queue[head++],x=i%w,y=(i/w)|0;
   const neighbors=[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1];
   for(const n of neighbors)if(n>=0&&dist[n]<0){
    dist[n]=dist[i]+1;const a=i*4,b=n*4;
    filled[b]=filled[a];filled[b+1]=filled[a+1];filled[b+2]=filled[a+2];filled[b+3]=255;
    queue[tail++]=n;
   }
  }
  const bg=document.getElementById('depth-bg');bg.width=w;bg.height=h;
  const bc=bg.getContext('2d');const out=bc.createImageData(w,h);out.data.set(filled);bc.putImageData(out,0,0);
  // Avoid harsh inpaint edges by softly blurring only the filled silhouette.
  const soft=document.createElement('canvas');soft.width=w;soft.height=h;
  const softCtx=soft.getContext('2d');softCtx.filter='blur(7px)';softCtx.drawImage(bg,0,0);
  const smooth=softCtx.getImageData(0,0,w,h).data;
  const bgData=bc.getImageData(0,0,w,h);
  for(let i=0;i<w*h;i++)if(mask[i]){
   const j=i*4;bgData.data[j]=smooth[j];bgData.data[j+1]=smooth[j+1];bgData.data[j+2]=smooth[j+2];
  }
  bc.putImageData(bgData,0,0);
  bg.hidden=false;fg.hidden=false;
  art.style.visibility='hidden';
 }catch(e){console.warn('Layer separation failed; original artwork retained',e);}
}
function prepareMasks(){buildGoldMask();buildOceanMask();buildSeparatedLayers();}
if(art.complete&&art.naturalWidth)prepareMasks();else art.addEventListener('load',prepareMasks,{once:true});
art.addEventListener('error',()=>{document.getElementById('missing').hidden=false});update()})();
</script></body></html>
