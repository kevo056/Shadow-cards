<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dragon Holographic v3 — Story Forge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101015;color:#eee;font:15px system-ui;text-align:center;padding:20px 10px}h1{font-size:21px}p{color:#bbb;max-width:460px;margin:12px auto}.stage{width:min(92vw,430px);aspect-ratio:1024/1516;position:relative;background:#000;border-radius:13px;overflow:hidden;margin:18px auto;box-shadow:0 16px 50px #000}.stage canvas,.stage img{position:absolute;top:0;left:0;width:100%;height:101.3193%;object-fit:fill}.frame{pointer-events:none}.ruby{z-index:3;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#ffb4a0 0%,#f83135 16%,#b70018 43%,#66000b 72%,#250006 100%);box-shadow:inset 0 0 2px 1px #40000b,0 0 3px #ff553b;pointer-events:none}.ruby:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#ff9a80 0 25%,#cb0920 26% 48%,#75000c 49% 74%,#ff3640 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.88}.top{top:3.5969%}.bottom{top:93.8216%;width:6.65%}.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;color:#fff;background:#2c2c34;border:1px solid #666;border-radius:9px;padding:10px 12px}button.active{border-color:#edba62;background:#60421b}#status{color:#e7bf79}
body{background:radial-gradient(circle at 50% 18%,#49251d,#101015 72%)}
.stage{perspective:720px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible;padding:10px 0}
.card{position:relative;width:100%;height:100%;background:#000;border-radius:13px;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .08s ease-out;box-shadow:0 22px 45px #000b;will-change:transform;touch-action:none}
.stage{height:auto}.card canvas,.card img.frame{position:absolute;top:0;left:0;width:100%;height:101.3193%;object-fit:fill;pointer-events:none}
.card .ruby{z-index:6}.card .frame{z-index:5}
.holo{position:absolute;z-index:2;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.62;background:linear-gradient(var(--holo-angle,110deg),transparent 4%,rgba(74,214,255,.12) 25%,rgba(116,90,255,.24) 38%,rgba(255,92,199,.31) 50%,rgba(255,190,85,.18) 65%,transparent 90%);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.foil{position:absolute;z-index:7;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.68;background:linear-gradient(var(--foil-angle,120deg),transparent 28%,#fff1a380 42%,#fff9d8bd 49%,#ffe18688 55%,transparent 70%);-webkit-mask-size:100% 100%;mask-size:100% 100%}

@keyframes sweep{0%,14%{transform:translateX(-120%)}72%,100%{transform:translateX(120%)}}

</style></head><body><h1>Dragon • Holographic v3</h1><p>Drag across the card to tilt. The foil, hologram and ember sparkles respond independently.</p><div class="stage" id="stage"><div class="card" id="card"><canvas id="art" width="1024" height="1536"></canvas><div class="holo" id="holo"></div><div class="embers" id="embers"><i style="--x:24%;--y:81%;--s:5px;--t:7s;--delay:-2s;--dx:8px"></i><i style="--x:36%;--y:63%;--s:4px;--t:9s;--delay:-5s;--dx:-8px"></i><i style="--x:72%;--y:76%;--s:6px;--t:8s;--delay:-4s;--dx:9px"></i><i style="--x:58%;--y:84%;--s:5px;--t:10s;--delay:-7s;--dx:-4px"></i><i style="--x:18%;--y:57%;--s:4px;--t:11s;--delay:-9s;--dx:10px"></i><i style="--x:82%;--y:48%;--s:5px;--t:8s;--delay:-3s;--dx:-7px"></i><i style="--x:48%;--y:72%;--s:5px;--t:9s;--delay:-6s;--dx:6px"></i><i style="--x:68%;--y:59%;--s:4px;--t:7s;--delay:-1s;--dx:8px"></i></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Gold trim"><div class="ruby top"></div><div class="ruby bottom"></div><div class="foil" id="foil"></div><div class="sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status">Loading Dragon artwork…</p><script>
const cv=document.getElementById('art'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),status=document.getElementById('status');
const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Local elliptical, softly feathered reconstruction; avoids visible rectangular seams. */function repair(cx,cy,rx,ry){const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);out.data.set(src.data);for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){const nx=(x-cx)/rx,ny=(y-cy)/ry,dist=Math.sqrt(nx*nx+ny*ny);if(dist>=1)continue;const blend=Math.min(1,Math.max(0,(1-dist)/.35));const sx1=Math.max(0,Math.round(cx-rx-16)),sx2=Math.min(w-1,Math.round(cx+rx+16));const t=Math.max(0,Math.min(1,(nx+1)/2));const t2=t*t*(3-2*t);const d=(y*w+x)*4,a=(y*w+sx1)*4,b=(y*w+sx2)*4;for(let k=0;k<3;k++){const v=src.data[a+k]*(1-t2)+src.data[b+k]*t2;out.data[d+k]=Math.round(src.data[d+k]*(1-blend)+v*blend)}}}ctx.putImageData(out,0,0)}repair(w*.5,h*.038,w*.087,h*.065);repair(w*.5,h*.963,w*.089,h*.065);/* Mask the unwanted outer perimeter of the original artwork, keeping the artwork beneath the gold ornament intact. */ctx.save();ctx.globalCompositeOperation='destination-in';ctx.beginPath();const insetX=w*.041,insetTop=h*.020,insetBottom=h*.958;ctx.roundRect(insetX,insetTop,w-2*insetX,insetBottom-insetTop,Math.min(w*.055,h*.035));ctx.fill();ctx.restore();status.textContent='Dragon artwork loaded. Gold frame over black outer backing; both rubies preserved at v9 positions.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';
const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal');
function update(){const x=Number(v.value),y=Number(h.value);card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--holo-angle',(112+y*3.8-x*2)+'deg');card.style.setProperty('--foil-angle',(115+y*3-x*2)+'deg');status.textContent='Tilt: '+x+'° / '+y+'°';}
let down=false;stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);move(e)});stage.addEventListener('pointermove',move);['pointerup','pointercancel','lostpointercapture'].forEach(k=>stage.addEventListener(k,()=>down=false));
function move(e){if(!down)return;const r=stage.getBoundingClientRect();h.value=Math.max(-22,Math.min(22,Math.round(((e.clientX-r.left)/r.width-.5)*44)));v.value=Math.max(-22,Math.min(22,Math.round((.5-(e.clientY-r.top)/r.height)*44)));update()}
v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=h.value=0;update()});update();
function makeMasks(){try{const c=document.createElement('canvas');c.width=384;c.height=576;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(cv,0,0,384,576);const data=x.getImageData(0,0,384,576);for(let y=0;y<576;y++)for(let xx=0;xx<384;xx++){const i=(y*384+xx)*4,r=data.data[i],g=data.data[i+1],b=data.data[i+2];const lum=Math.max(r,g,b);const inside=xx>32&&xx<352&&y>30&&y<547;data.data[i]=data.data[i+1]=data.data[i+2]=255;data.data[i+3]=inside&&lum>58?Math.min(210,Math.round((lum-58)*1.65)):0}x.putImageData(data,0,0);const mask='url("'+c.toDataURL('image/png')+'")';for(const el of [document.getElementById('holo'),document.getElementById('embers')]){el.style.webkitMaskImage=mask;el.style.maskImage=mask}}catch(e){console.warn('Hologram mask:',e)}
try{const c=document.createElement('canvas');c.width=384;c.height=576;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frame,0,0,384,576);const data=x.getImageData(0,0,384,576);for(let i=0;i<data.data.length;i+=4){const r=data.data[i],g=data.data[i+1],b=data.data[i+2],a=data.data[i+3];data.data[i]=data.data[i+1]=data.data[i+2]=255;data.data[i+3]=a&&r>68&&g>34&&r>g*1.1&&g>b*1.07?a:0}x.putImageData(data,0,0);const mask='url("'+c.toDataURL('image/png')+'")';const foil=document.getElementById('foil');foil.style.webkitMaskImage=mask;foil.style.maskImage=mask}catch(e){console.warn('Foil mask:',e)}}
let readyArt=false,readyFrame=false;const originalLoad=img.onload;img.onload=()=>{originalLoad();readyArt=true;if(readyFrame)makeMasks()};frame.addEventListener('load',()=>{readyFrame=true;if(readyArt)makeMasks()});if(img.complete&&img.naturalWidth){img.onload()}if(frame.complete&&frame.naturalWidth){readyFrame=true;if(readyArt)makeMasks()}
</script></body></html>
