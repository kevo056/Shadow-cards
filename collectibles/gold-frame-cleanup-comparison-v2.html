<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Forge • Universal Collectible Template</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#233847,#071018 75%);color:#f1f4f6;font:15px system-ui,sans-serif;text-align:center;padding:18px}h1{font-size:21px}p{font-size:13px;max-width:560px;margin:8px auto 18px;color:#b9c8d4}.stage{perspective:850px;touch-action:none;padding:15px}.card{position:relative;width:min(78vw,330px);aspect-ratio:2/3;margin:auto;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));overflow:hidden;border-radius:13px;box-shadow:0 22px 38px #0009;touch-action:none;background:#000}.art,.frame,.foil,.glint,.sweep,.orbs{position:absolute;inset:0;pointer-events:none}.art{inset:3.5%;border-radius:4px;background:radial-gradient(circle at 45% 35%,#3280a1,#12354e 48%,#081626 85%)}.art.forest{background:radial-gradient(circle at 48% 40%,#6c7c4a,#233e30 50%,#101e1b 90%)}.art.black{background:#000}.art.ember{background:radial-gradient(circle at 48% 40%,#b46637,#4a2025 52%,#160d1d 90%)}.art img{width:100%;height:100%;object-fit:cover}.frame{width:100%;height:100%}.foil{mix-blend-mode:screen;background:linear-gradient(var(--angle,120deg),transparent 15%,#ffe3a633 28%,#fff3c7c4 43%,transparent 57%);-webkit-mask-image:var(--gold-mask);mask-image:var(--gold-mask)}.glint{mix-blend-mode:screen;background:linear-gradient(var(--angle,120deg),transparent 34%,#ffffffb0 49%,transparent 60%);opacity:.65;-webkit-mask-image:var(--gold-mask);mask-image:var(--gold-mask)}.sweep{inset:-8% -25%;mix-blend-mode:screen;background:linear-gradient(110deg,transparent 39%,#b6eeff10 44%,#f4fcff66 50%,transparent 60%);animation:sweep 5.6s ease-in-out infinite}@keyframes sweep{0%,14%{transform:translateX(-95%)}70%,100%{transform:translateX(95%)}}.orbs{overflow:hidden}.orbs i{position:absolute;left:var(--x);top:var(--y);width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#e8ffff,#58d4fbb0 45%,transparent 80%);box-shadow:0 0 10px #67dcff;animation:rise var(--t) linear infinite;animation-delay:var(--delay)}@keyframes rise{0%{opacity:0;transform:translateY(15px)}30%{opacity:.8}90%{opacity:.4}100%{opacity:0;transform:translateY(-55px)}}.card.standard .foil,.card.standard .glint,.card.standard .sweep,.card.standard .orbs{display:none}@media(prefers-reduced-motion:reduce){.sweep,.orbs i{animation:none;opacity:0}}.controls{margin:15px auto;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}select,button{background:#1c3544;color:white;border:1px solid #b79a66;border-radius:8px;padding:10px}label{font-size:13px}.hint{font-size:12px;color:#a9c0d0}
</style></head><body><h1>Gold Frame Cleanup Comparison v2</h1><p>Compare the saved original extraction against a conservative cleanup of small gold gaps. No artwork or approved card is modified.</p><div class="stage" id="stage"><div class="card standard" id="card"><div class="art" id="art"></div><div class="orbs" id="orbs"></div><canvas class="frame" id="frame" width="384" height="576"></canvas><div class="foil"></div><div class="glint"></div><div class="sweep"></div></div></div><div class="controls"><label>Variant <select id="variant"><option value="standard">Standard</option><option value="holographic">Holographic</option></select></label><label>Backdrop <select id="backdrop"><option value="">Borderless ocean</option><option value="forest">Forest</option><option value="ember">Ember</option><option value="black">Black</option></select></label><button id="compare">Show original extraction</button><button id="reset">Reset tilt</button></div><p class="hint" id="status">Preparing reusable frame…</p><img id="source" src="../approved_original_mermaid.png" hidden alt="">
<script>
(()=>{const card=document.getElementById('card'),stage=document.getElementById('stage'),source=document.getElementById('source'),frame=document.getElementById('frame'),art=document.getElementById('art'),status=document.getElementById('status'),orbs=document.getElementById('orbs');let down=false;
function extract(){const w=384,h=576,ctx=document.createElement('canvas').getContext('2d',{willReadFrequently:true});ctx.canvas.width=w;ctx.canvas.height=h;ctx.drawImage(source,0,0,w,h);const data=ctx.getImageData(0,0,w,h),p=data.data,n=w*h,mask=new Float32Array(n),rad=20;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,j=i*4,r=p[j],g=p[j+1],b=p[j+2];const ornament=x<18||x>w-19||y<16||y>h-17||((x<87||x>w-88)&&(y<112||y>h-112))||x<35||x>w-36||y<39||y>h-40;const gold=r>65&&g>35&&r-g>13&&g-b>6.76&&r>b*1.22;mask[i]=ornament&&gold?Math.min(255,Math.max(0,(r-46)*4)):0}const out=new ImageData(new Uint8ClampedArray(p),w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let a=mask[i];if(!a){let hits=0,total=0;for(let yy=Math.max(0,y-2);yy<=Math.min(h-1,y+2);yy++)for(let xx=Math.max(0,x-2);xx<=Math.min(w-1,x+2);xx++){const v=mask[yy*w+xx];if(v>80)hits++;total+=v}a=hits>=3?Math.min(180,total/25):0}const top=((x-w*.5)/(rad*.95))**2+((y-h*.064)/(rad*.95))**2<1,bot=((x-w*.5)/(rad*.95))**2+((y-h*.936)/(rad*.95))**2<1,r=p[i*4],g=p[i*4+1],b=p[i*4+2];if((top||bot)&&b>r*1.1&&b>g*.9)a=0;out.data[i*4+3]=Math.round(a)}const original=new ImageData(new Uint8ClampedArray(out.data),w,h);const cleaned=new ImageData(new Uint8ClampedArray(out.data),w,h);const alpha=(x,y)=>original.data[(y*w+x)*4+3];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;if(original.data[i+3]>75)continue;const horizontal=alpha(x-1,y)>110&&alpha(x+1,y)>110;const vertical=alpha(x,y-1)>110&&alpha(x,y+1)>110;const nearTop=y<22&&x>18&&x<w-18;const bridge=horizontal||vertical;if(!bridge)continue;const gold=p[i]>p[i+2]*1.12&&p[i]>58;const neighbors=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([xx,yy])=>alpha(xx,yy)>110);if(neighbors.length<2)continue;for(let k=0;k<3;k++)cleaned.data[i+k]=gold?p[i+k]:Math.round(neighbors.reduce((sum,[xx,yy])=>sum+original.data[(yy*w+xx)*4+k],0)/neighbors.length);cleaned.data[i+3]=nearTop?205:160;}window._frameOriginal=original;window._frameCleaned=cleaned;frame.getContext('2d').putImageData(cleaned,0,0);const maskCanvas=document.createElement('canvas');maskCanvas.width=w;maskCanvas.height=h;const m=maskCanvas.getContext('2d');m.putImageData(cleaned,0,0);card.style.setProperty('--gold-mask','url("'+maskCanvas.toDataURL('image/png')+'")');status.textContent='Cleanup active: only isolated 1-pixel gaps are bridged. Toggle to compare against the saved extraction.'}
source.addEventListener('load',extract);source.addEventListener('error',()=>status.textContent='Original approved frame source unavailable');if(source.complete&&source.naturalWidth)extract();
for(let i=0;i<9;i++){const orb=document.createElement('i');orb.style.cssText='--x:'+(25+i*5.8)+'%;--y:'+(46+(i*13)%42)+'%;--t:'+(9+i%6)+'s;--delay:-'+(i*1.7)+'s';orbs.append(orb)}
let cleanedOn=true;document.getElementById('compare').addEventListener('click',()=>{cleanedOn=!cleanedOn;frame.getContext('2d').putImageData(cleanedOn?window._frameCleaned:window._frameOriginal,0,0);document.getElementById('compare').textContent=cleanedOn?'Show original extraction':'Show cleaned extraction';status.textContent=cleanedOn?'Cleanup active':'Original saved extraction active'});document.getElementById('variant').addEventListener('change',e=>card.classList.toggle('standard',e.target.value==='standard'));document.getElementById('backdrop').addEventListener('change',e=>art.className='art '+e.target.value);
function tilt(x,y){card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--angle',(110+y*3-x*2)+'deg')}function move(e){if(!down)return;const r=stage.getBoundingClientRect();tilt(Math.max(-22,Math.min(22,(.5-(e.clientY-r.top)/r.height)*44)),Math.max(-22,Math.min(22,((e.clientX-r.left)/r.width-.5)*44)))}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);move(e)});stage.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);document.getElementById('reset').addEventListener('click',()=>tilt(0,0));
})();</script></body></html>
