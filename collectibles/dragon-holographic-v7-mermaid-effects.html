</style></head><body><h1>Dragon • Holographic v7</h1><p>Approved Mermaid v27 foil, glint, hologram and drifting particles adapted to Dragon.</p><div class="stage" id="stage"><div class="card" id="card"><canvas id="art" width="1024" height="1536"></canvas><div class="holo"></div><div class="dragon-orbs" aria-hidden="true"><i style="--x:31%;--y:76%;--d:8px;--t:11s;--delay:-2s;--dx:9px"></i><i style="--x:64%;--y:66%;--d:7px;--t:13s;--delay:-7s;--dx:-8px"></i><i style="--x:41%;--y:53%;--d:6px;--t:9s;--delay:-4s;--dx:5px"></i><i style="--x:70%;--y:82%;--d:8px;--t:14s;--delay:-10s;--dx:-7px"></i><i style="--x:27%;--y:46%;--d:6px;--t:12s;--delay:-6s;--dx:7px"></i><i style="--x:58%;--y:89%;--d:7px;--t:15s;--delay:-1s;--dx:-5px"></i><i style="--x:48%;--y:73%;--d:7px;--t:12s;--delay:-8s;--dx:7px"></i><i style="--x:73%;--y:49%;--d:6px;--t:10s;--delay:-5s;--dx:-6px"></i><i style="--x:35%;--y:87%;--d:8px;--t:14s;--delay:-11s;--dx:8px"></i></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Approved gold frame"><div class="ruby top"></div><div class="ruby bottom"></div><div class="foil"></div><div class="gold-glint"></div><div class="soft-sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status">Loading Dragon…</p><script>
const cv=document.getElementById('art'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),status=document.getElementById('status');const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Local elliptical, softly feathered reconstruction; avoids visible rectangular seams. */function repair(cx,cy,rx,ry){const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);out.data.set(src.data);for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){const nx=(x-cx)/rx,ny=(y-cy)/ry,dist=Math.sqrt(nx*nx+ny*ny);if(dist>=1)continue;const blend=Math.min(1,Math.max(0,(1-dist)/.35));const sx1=Math.max(0,Math.round(cx-rx-16)),sx2=Math.min(w-1,Math.round(cx+rx+16));const t=Math.max(0,Math.min(1,(nx+1)/2));const t2=t*t*(3-2*t);const d=(y*w+x)*4,a=(y*w+sx1)*4,b=(y*w+sx2)*4;for(let k=0;k<3;k++){const v=src.data[a+k]*(1-t2)+src.data[b+k]*t2;out.data[d+k]=Math.round(src.data[d+k]*(1-blend)+v*blend)}}}ctx.putImageData(out,0,0)}repair(w*.5,h*.038,w*.087,h*.065);repair(w*.5,h*.963,w*.089,h*.065);/* Mask the unwanted outer perimeter of the original artwork, keeping the artwork beneath the gold ornament intact. */ctx.save();ctx.globalCompositeOperation='destination-in';ctx.beginPath();const insetX=w*.041,insetTop=h*.020,insetBottom=h*.958;ctx.roundRect(insetX,insetTop,w-2*insetX,insetBottom-insetTop,Math.min(w*.055,h*.035));ctx.fill();ctx.restore();status.textContent='Dragon artwork loaded. Gold frame over black outer backing; both rubies preserved at v9 positions.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';

const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal');
let down=false,targetX=0,targetY=0,currentX=0,currentY=0,raf=0;
function render(){raf=0;currentX+=(targetX-currentX)*.48;currentY+=(targetY-currentY)*.48;card.style.transform='rotateX('+currentX+'deg) rotateY('+currentY+'deg)';card.style.setProperty('--angle',(90+currentY*3.6-currentX*2.1)+'deg');card.style.setProperty('--holo-angle',(115-currentY*4+currentX*2.5)+'deg');card.style.setProperty('--glint-angle',(115+currentY*2-currentX)+'deg');card.style.setProperty('--glint-x',(50+currentY*2)+'%');card.style.setProperty('--glow','1');if(Math.abs(targetX-currentX)+Math.abs(targetY-currentY)>.12)queue()}
function queue(){if(!raf)raf=requestAnimationFrame(render)}function update(){targetX=Number(v.value);targetY=Number(h.value);queue()}
function move(e){if(!down)return;const r=stage.getBoundingClientRect();targetY=Math.max(-22,Math.min(22,((e.clientX-r.left)/r.width-.5)*44));targetX=Math.max(-22,Math.min(22,(.5-(e.clientY-r.top)/r.height)*44));v.value=Math.round(targetX);h.value=Math.round(targetY);queue()}
stage.addEventListener('pointerdown',e=>{down=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}move(e)},{passive:true});stage.addEventListener('pointermove',move,{passive:true});for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=0;h.value=0;update()});update();
function applyMask(el,url){el.style.webkitMaskImage=url;el.style.maskImage=url;el.style.webkitMaskSize='100% 100%';el.style.maskSize='100% 100%'}
function prepareMasks(){if(!img.naturalWidth||!frame.naturalWidth)return;
try{const c=document.createElement('canvas'),w=384,hh=576;c.width=w;c.height=hh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frame,0,0,w,hh);const a=x.getImageData(0,0,w,hh),p=a.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],alpha=p[i+3];p[i]=p[i+1]=p[i+2]=255;p[i+3]=alpha&&r>74&&g>43&&r-g>9&&g-b>9&&r>b*1.35?Math.min(255,Math.max(110,(r-50)*4.3)):0}x.putImageData(a,0,0);const mask='url("'+c.toDataURL()+'")';applyMask(card.querySelector('.foil'),mask);applyMask(card.querySelector('.gold-glint'),mask)}catch(e){console.warn('Gold mask',e)}
try{const c=document.createElement('canvas'),w=384,hh=576;c.width=w;c.height=hh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(cv,0,0,w,hh);const a=x.getImageData(0,0,w,hh),p=a.data;const o=x.createImageData(w,hh),q=o.data;for(let y=0;y<hh;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,r=p[i],g=p[i+1],b=p[i+2],bright=Math.max(r,g,b);const inside=xx>36&&xx<w-36&&y>39&&y<hh-39;const warmth=r>g*.97&&r>b*1.1;const amount=inside&&warmth&&bright>76?Math.min(210,Math.round((bright-67)*1.9)):0;q[i]=q[i+1]=q[i+2]=255;q[i+3]=amount}x.putImageData(o,0,0);applyMask(card.querySelector('.holo'),'url("'+c.toDataURL()+'")');
for(let i=0;i<q.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],bright=Math.max(r,g,b),xx=(i/4)%w,y=Math.floor((i/4)/w);const inside=xx>42&&xx<w-42&&y>45&&y<hh-45;q[i+3]=inside&&bright>55?Math.min(255,Math.round((bright-45)*3)):0}x.putImageData(o,0,0);applyMask(card.querySelector('.dragon-orbs'),'url("'+c.toDataURL()+'")')}catch(e){console.warn('Art masks',e)}
status.textContent='Dragon ready • Mermaid v27-style effects active'}
const prev=img.onload;img.onload=()=>{prev();prepareMasks()};frame.addEventListener('load',prepareMasks);if(img.complete&&img.naturalWidth&&frame.complete&&frame.naturalWidth)prepareMasks();
