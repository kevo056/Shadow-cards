<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Forge — Dragon Gold Frame Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101015;color:#eee;font:15px system-ui;text-align:center;padding:22px 12px}h1{font-size:21px;margin:12px 0}p{color:#bbb;max-width:500px;margin:12px auto}.stage{width:min(88vw,420px);aspect-ratio:2/3;position:relative;background:#000;border-radius:12px;overflow:hidden;margin:20px auto;box-shadow:0 16px 50px #000}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.frame{pointer-events:none}.gem-mask{position:absolute;left:0;right:0;bottom:0;height:3.5%;background:#000;pointer-events:none}.gem-mask:before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:#000}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}button{font:inherit;color:white;background:#2c2c34;border:1px solid #666;border-radius:9px;padding:10px 12px}button.active{border-color:#edba62;background:#60421b}#status{color:#e7bf79}</style></head><body><h1>Dragon — Gem Alignment Test v2</h1><p>Original artwork and frame unchanged. A small bottom gemstone overlap is masked to remove the protruding ruby tip and original black border.</p><div class="stage"><img id="dragon" src="../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png" alt="Uploaded dragon card art"><div id="gemMask" class="gem-mask"></div><img id="frame" class="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Approved gold frame"></div><div class="buttons"><button class="active" data-mode="both">Combined</button><button data-mode="art">Dragon only</button><button data-mode="frame">Gold frame only</button></div><p id="status">Loading artwork…</p><p>No source PNGs were modified. The bottom ruby tip is hidden without moving or scaling either PNG.</p><script>const dragon=document.getElementById('dragon'),frame=document.getElementById('frame'),status=document.getElementById('status');function check(){if(dragon.complete&&dragon.naturalWidth&&frame.complete&&frame.naturalWidth)status.textContent='Both PNGs loaded ('+dragon.naturalWidth+' × '+dragon.naturalHeight+' Dragon; '+frame.naturalWidth+' × '+frame.naturalHeight+' frame).'}dragon.onload=check;frame.onload=check;dragon.onerror=()=>status.textContent='Dragon image failed to load.';frame.onerror=()=>status.textContent='Gold frame failed to load.';check();document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.mode;dragon.style.opacity=m==='frame'?0:1;frame.style.opacity=m==='art'?0:1;document.getElementById('gemMask').style.opacity=m==='art'?0:1;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}));</script></body></html>
