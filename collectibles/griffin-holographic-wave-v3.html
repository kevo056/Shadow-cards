<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Griffin • Holographic Wave v3 | Story Forge</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 18%,#24538b,#060c1d 78%);color:#e0f0ff;font:16px system-ui,sans-serif;display:grid;place-items:center}
.wrap{width:min(100%,540px);padding:18px 16px;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{font-size:13px;color:#aac9e9}
.stage{position:relative;perspective:650px;padding:22px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.card{position:relative;margin:auto;width:min(82vw,355px);aspect-ratio:2/3;overflow:hidden;border-radius:14px;background:#000;isolation:isolate;box-shadow:0 25px 40px #0009;transform:rotateX(0deg) rotateY(0deg);transform-style:preserve-3d;will-change:transform;touch-action:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.art{z-index:1;clip-path:inset(4.15% round 9px)}
.bottom-black{position:absolute;z-index:2;inset:92.1% 0 0;background:#000;pointer-events:none}
.frame{z-index:3;filter:brightness(1.08) drop-shadow(0 0 1.2px rgba(255,209,100,.55))}
.gem{position:absolute;z-index:5;left:50%;top:3.5969%;width:5.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#fffbd3 0%,#ffe968 16%,#e6a914 43%,#96600a 72%,#422904 100%);box-shadow:inset 0 0 2px 1px #62400a,0 0 5px 1px #ffe17a,0 0 10px #b88326;pointer-events:none}
.gem:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#fff6ba 0 25%,#f6cc37 26% 48%,#b7790d 49% 74%,#ffec76 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.92}
.gem.bottom{top:92.60%;width:5.7%}
.controls{max-width:340px;margin:12px auto;text-align:left}
.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}
.controls input{width:65%;accent-color:#cfa454}
button{background:#0e2138;border:1px solid #bd9653;border-radius:8px;color:#f7e9c7;padding:9px 18px}

/* Frame-only metallic shine; the mask is extracted once from the original gold PNG. */
.gold-shine{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:0;mix-blend-mode:screen;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.gold-shine.ready{opacity:1}
.gold-shine::before{content:"";position:absolute;inset:0;
 background:linear-gradient(var(--gold-angle,125deg),
 transparent 4%,rgba(255,208,88,.18) 18%,rgba(255,239,159,.43) 32%,
 rgba(255,255,234,.80) 42%,rgba(255,247,190,.46) 51%,transparent 66%),
 repeating-linear-gradient(132deg,transparent 0 11%,rgba(255,239,178,.18) 11.4%,transparent 12.2% 22%);
 opacity:var(--gold-intensity,.70)}
.gold-shine::after{content:"";position:absolute;inset:0;
 background:
 linear-gradient(115deg,transparent 34%,rgba(255,229,137,.20) 39%,rgba(255,255,233,.98) 45%,rgba(255,242,165,.72) 48%,transparent 55%),
 linear-gradient(24deg,transparent 38%,rgba(255,241,182,.28) 45%,rgba(255,255,245,.93) 49%,transparent 55%);
 background-size:210% 210%,180% 180%;
 background-position:var(--shine-x,50%) var(--shine-y,50%),var(--shine-x2,50%) var(--shine-y2,50%);
 opacity:var(--shine-strength,.78);
 transition:background-position 70ms linear,opacity 70ms linear}
@media(prefers-reduced-motion:reduce){.gold-shine::after{transition:none}}

/* Sky-only animated wave: hue travels in curved bands rather than sliding
   as a straight foil gradient. Both canvases inherit the Griffin-safe pixel mask. */
.sky-chroma,.ocean-sweep{position:absolute;inset:0;width:100%;height:100%;z-index:2;
 pointer-events:none;clip-path:inset(4.15% round 9px);visibility:hidden;opacity:0;
 -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
 -webkit-mask-size:100% 100%;mask-size:100% 100%}
.sky-chroma{mix-blend-mode:color}
.ocean-sweep{mix-blend-mode:screen}
.card.ocean-ready .sky-chroma{visibility:visible;opacity:.66}
.card.ocean-ready .ocean-sweep{visibility:visible;opacity:.70}
@media(prefers-reduced-motion:reduce){.sky-chroma,.ocean-sweep{will-change:auto}}
</style></head><body><main class="wrap">
<h1>Griffin • Holographic Wave v3</h1>
<p>Approved Griffin artwork • Original gold trim • Gold gemstones • Interactive tilt • Flowing iridescent sky waves with soft traveling highlights • Protected black Griffin</p>
<div class="stage" id="stage"><div class="card" id="card">
<img class="art" id="griffin-art" src="../A2ED838B-6817-4C7A-93F3-E0B84412A255.png" alt="Approved pure-black flying Griffin silhouette over blue skies, clouds and illustrated birds">
<canvas class="sky-chroma" id="sky-chroma" aria-hidden="true" width="192" height="288"></canvas>
<div class="ocean-holo" id="ocean-holo" aria-hidden="true"></div>
<canvas class="ocean-sweep" id="ocean-sweep" aria-hidden="true" width="192" height="288"></canvas>
<div class="bottom-black" aria-hidden="true"></div>
<img class="frame" id="frame-gold" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Original gold card trim">
<div class="gold-shine" id="gold-shine" aria-hidden="true"></div>
<div class="gem top" role="img" aria-label="Top golden gemstone"></div>
<div class="gem bottom" role="img" aria-label="Bottom golden gemstone"></div>
</div></div>
<div class="controls">
<label for="vertical">Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label>
<label for="horizontal">Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label>
</div>
<button id="reset">Reset tilt</button>
<p id="tilt-status" aria-live="off" style="font-size:12px">Tilt: 0° horizontal / 0° vertical</p>
</main>
<script>
'use strict';
// Reliable iOS touch dragging + mouse/pointer fallback.
// Card position is measured from its untransformed layout box to avoid
// feedback/jitter while rotating. The approved Griffin artwork and original gold frame remain unchanged.
const card=document.getElementById('card');
const stage=document.getElementById('stage');
const vertical=document.getElementById('vertical');
const horizontal=document.getElementById('horizontal');
const readout=document.getElementById('tilt-status');
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function renderTilt(){
 const x=Number(horizontal.value),y=Number(vertical.value);
 card.style.transform='rotateX('+y+'deg) rotateY('+x+'deg)';
 card.style.setProperty('--gold-angle',(125+x*2.8-y*1.6)+'deg');

 card.style.setProperty('--gold-intensity',String(.65+Math.min(.3,(Math.abs(x)+Math.abs(y))*.009)));
 card.style.setProperty('--shine-x',(50+x*2.15)+'%');
 card.style.setProperty('--shine-y',(50-y*2.0)+'%');
 card.style.setProperty('--shine-x2',(50-x*1.6)+'%');
 card.style.setProperty('--shine-y2',(50+y*1.7)+'%');
 card.style.setProperty('--shine-strength',String(.72+Math.min(.28,(Math.abs(x)+Math.abs(y))*.009)));
 readout.textContent='Tilt: '+x+'° horizontal / '+y+'° vertical';
}
function setTiltFromPosition(clientX,clientY){
 const stageRect=stage.getBoundingClientRect();
 const cx=stageRect.left+card.offsetLeft+card.offsetWidth/2;
 const cy=stageRect.top+card.offsetTop+card.offsetHeight/2;
 const dx=(clientX-cx)/(card.offsetWidth/2);
 const dy=(clientY-cy)/(card.offsetHeight/2);
 horizontal.value=String(Math.round(clamp(dx*22,-22,22)));
 vertical.value=String(Math.round(clamp(-dy*22,-22,22)));
 renderTilt();
}
vertical.addEventListener('input',renderTilt);
horizontal.addEventListener('input',renderTilt);
document.getElementById('reset').addEventListener('click',()=>{
 vertical.value='0';horizontal.value='0';renderTilt();
});
let mouseDragging=false;
stage.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')return;
 mouseDragging=true;
 try{stage.setPointerCapture(e.pointerId)}catch(_){}
 setTiltFromPosition(e.clientX,e.clientY);
});
stage.addEventListener('pointermove',e=>{
 if(!mouseDragging)return;
 setTiltFromPosition(e.clientX,e.clientY);
});
for(const t of ['pointerup','pointercancel','lostpointercapture']){
 stage.addEventListener(t,()=>{mouseDragging=false;});
}
let activeTouch=null;
stage.addEventListener('touchstart',e=>{
 if(activeTouch!==null||!e.changedTouches.length)return;
 const touch=e.changedTouches[0];
 activeTouch=touch.identifier;
 if(e.cancelable)e.preventDefault();
 setTiltFromPosition(touch.clientX,touch.clientY);
},{passive:false});
stage.addEventListener('touchmove',e=>{
 if(activeTouch===null)return;
 for(const touch of e.changedTouches){
  if(touch.identifier===activeTouch){
   if(e.cancelable)e.preventDefault();
   setTiltFromPosition(touch.clientX,touch.clientY);
   break;
  }
 }
},{passive:false});
function endTouch(e){
 if(activeTouch===null)return;
 for(const t of e.changedTouches){
  if(t.identifier===activeTouch){activeTouch=null;break;}
 }
}
stage.addEventListener('touchend',endTouch,{passive:true});
stage.addEventListener('touchcancel',endTouch,{passive:true});
renderTilt();

/* Sample the actual frame once; never allow gold light onto the Griffin or the blue scene. */
(function(){
 const frame=document.getElementById('frame-gold');
 const shine=document.getElementById('gold-shine');
 function prepare(){
  if(!frame.naturalWidth)return;
  try{
   const c=document.createElement('canvas');c.width=512;c.height=768;
   const ctx=c.getContext('2d',{willReadFrequently:true});
   ctx.drawImage(frame,0,0,c.width,c.height);
   const img=ctx.getImageData(0,0,c.width,c.height),p=img.data,w=c.width,h=c.height;
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2],a=p[i+3];
    const perimeter=(x<w*.16||x>w*.84||y<h*.105||y>h*.895);
    const golden=(r>70&&g>38&&r>g*1.10&&g>b*1.14&&r>b*1.34);
    p[i]=p[i+1]=p[i+2]=255;
    p[i+3]=perimeter&&golden&&a>10?Math.round(a*.93):0;
   }
   ctx.putImageData(img,0,0);
   const url='url("'+c.toDataURL('image/png')+'")';
   shine.style.webkitMaskImage=url;shine.style.maskImage=url;
   shine.classList.add('ready');
  }catch(err){shine.style.display='none';console.warn('Gold shine disabled because the frame mask was unavailable',err);}
 }
 if(frame.complete&&frame.naturalWidth)prepare();
 else frame.addEventListener('load',prepare,{once:true});
 frame.addEventListener('error',()=>{shine.style.display='none'},{once:true});
})();


/* Extract a background-only mask from the original approved Griffin PNG.
   Near-black pixels and a 1-pixel halo around them are excluded.
   The sky hologram and automatic glint share this exact same stationary mask.
   If reading the artwork fails, effects remain hidden rather than touching the Griffin. */
(function(){
 const art=document.getElementById('griffin-art');
 const holo=document.getElementById('ocean-holo');
 const chroma=document.getElementById('sky-chroma');
 const sweep=document.getElementById('ocean-sweep');
 function prepare(){
  if(!art.naturalWidth)return;
  try{
   const w=512,h=768,c=document.createElement('canvas');
   c.width=w;c.height=h;
   const ctx=c.getContext('2d',{willReadFrequently:true});
   ctx.drawImage(art,0,0,w,h);
   const img=ctx.getImageData(0,0,w,h),p=img.data;
   const black=new Uint8Array(w*h);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2];
    const hi=Math.max(r,g,b);
    black[y*w+x]=(hi<39)?1:0;
   }
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2],hi=Math.max(r,g,b),lo=Math.min(r,g,b);
    const inside=x>w*.055&&x<w*.945&&y>h*.045&&y<h*.915;
    // Do not allow even anti-aliased pixels immediately bordering the pure-black figure.
    let touchesBlack=false;
    if(inside&&hi<105){
     for(let dy=-1;dy<=1&&!touchesBlack;dy++)for(let dx=-1;dx<=1;dx++){
      const xx=x+dx,yy=y+dy;
      if(xx>=0&&xx<w&&yy>=0&&yy<h&&black[yy*w+xx]){touchesBlack=true;break}
     }
    }
    const scenery=Math.max(0,Math.min(1,(hi-56)/48));
    const colored=Math.max(0,Math.min(1,(hi-lo-8)/25));
    const amount=inside&&!touchesBlack?Math.round(235*scenery*(.45+.55*colored)):0;
    p[i]=p[i+1]=p[i+2]=255;p[i+3]=amount;
   }
   ctx.putImageData(img,0,0);
   const mask='url("'+c.toDataURL('image/png')+'")';
   for(const layer of [chroma,holo,sweep]){
    layer.style.webkitMaskImage=mask;layer.style.maskImage=mask;
    layer.style.webkitMaskSize='100% 100%';layer.style.maskSize='100% 100%';
   }
   card.classList.add('ocean-ready');
   startSkyWave();
  }catch(err){
   chroma.style.display='none';holo.style.display='none';sweep.style.display='none';
   console.warn('Griffin silhouette protection mask unavailable: effects disabled',err);
  }
 }
 if(art.complete&&art.naturalWidth)prepare();
 else art.addEventListener('load',prepare,{once:true});
 art.addEventListener('error',()=>{holo.style.display='none';sweep.style.display='none'},{once:true});
})();

/* Curved, traveling interference waves. Hue is applied in COLOR blend mode so
   the sky keeps its original brightness. The second canvas provides only a
   restrained, curved specular crest, not a straight sweeping white bar.
   No animation starts unless the Griffin-exclusion mask is ready. */
let waveStarted=false;
function startSkyWave(){
 if(waveStarted)return;
 waveStarted=true;
 const chroma=document.getElementById('sky-chroma');
 const sheen=document.getElementById('ocean-sweep');
 const w=chroma.width,h=chroma.height;
 const ctx=chroma.getContext('2d',{alpha:true});
 const gl= sheen.getContext('2d',{alpha:true});
 if(!ctx||!gl)return;
 const colors=ctx.createImageData(w,h),lights=gl.createImageData(w,h);
 const cp=colors.data,lp=lights.data;
 // Precompute a moderately saturated hue wheel; COLOR blending preserves lightness.
 const palette=new Uint8Array(360*3);
 for(let hue=0;hue<360;hue++){
  const sat=.72,val=.96,c=val*sat,hh=hue/60;
  const xx=c*(1-Math.abs(hh%2-1)),m=val-c;
  const v=hh<1?[c,xx,0]:hh<2?[xx,c,0]:hh<3?[0,c,xx]:hh<4?[0,xx,c]:hh<5?[xx,0,c]:[c,0,xx];
  for(let k=0;k<3;k++)palette[hue*3+k]=Math.round((v[k]+m)*255);
 }
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let previous=-1000;
 function paint(ms){
  if(!document.hidden&&(ms-previous>=42||reduce)){
   previous=ms;
   const t=reduce?0:ms*.001;
   const tx=Number(horizontal.value)/22,ty=Number(vertical.value)/22;
   // Wavefronts roll upward/rightward; the two sinusoids curve and undulate
   // the colored bands instead of producing a straight moving stripe.
   for(let y=0;y<h;y++){
    const yn=y/h;
    const bend=.16*Math.sin(yn*8.7-t*.48+tx*.9);
    for(let x=0;x<w;x++){
     const xn=x/w;
     const phase=xn*1.55+yn*.70-t*.19+bend
      +.065*Math.sin(xn*11.2+yn*4.2-t*.62+ty);
     const band=Math.sin(phase*Math.PI*2);
     const secondary=Math.sin(phase*Math.PI*4+.7);
     let hue=Math.round(235+91*band+24*secondary+16*Math.sin(t*.24+yn*5));
     hue=((hue%360)+360)%360;
     const pi=(y*w+x)*4,ci=hue*3;
     cp[pi]=palette[ci];cp[pi+1]=palette[ci+1];cp[pi+2]=palette[ci+2];cp[pi+3]=255;
     // Broad, feathered crest following the SAME bent wavefront.
     const crest=Math.pow(Math.max(0,(Math.cos(phase*Math.PI*2-.55)-.45)/.55),2);
     const glow=Math.round(62*crest);
     lp[pi]=185;lp[pi+1]=225;lp[pi+2]=255;lp[pi+3]=glow;
    }
   }
   ctx.putImageData(colors,0,0);
   gl.putImageData(lights,0,0);
   if(reduce)return;
  }
  requestAnimationFrame(paint);
 }
 requestAnimationFrame(paint);
}

</script></body></html>
