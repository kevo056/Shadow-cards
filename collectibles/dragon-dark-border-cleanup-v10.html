<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon — Dark Border Cleanup v10</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101015;color:#eee;font:15px system-ui;text-align:center;padding:20px 10px}h1{font-size:21px}p{color:#bbb;max-width:460px;margin:12px auto}.stage{width:min(92vw,430px);aspect-ratio:2/3;position:relative;background:#000;border-radius:13px;overflow:hidden;margin:18px auto;box-shadow:0 16px 50px #000}.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.frame{pointer-events:none}.ruby{z-index:3;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#ffb4a0 0%,#f83135 16%,#b70018 43%,#66000b 72%,#250006 100%);box-shadow:inset 0 0 2px 1px #40000b,0 0 3px #ff553b;pointer-events:none}.ruby:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#ff9a80 0 25%,#cb0920 26% 48%,#75000c 49% 74%,#ff3640 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.88}.top{top:3.55%}.bottom{top:92.6%;width:6.65%}.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;color:#fff;background:#2c2c34;border:1px solid #666;border-radius:9px;padding:10px 12px}button.active{border-color:#edba62;background:#60421b}#status{color:#e7bf79}</style></head><body><h1>Dragon — Dark Border Cleanup v10</h1><p>Both approved ruby positions are preserved. The exposed original border is concealed with black backing beneath the gold-frame overlay.</p><div class="stage"><canvas id="art" width="1024" height="1536"></canvas><div class="ruby top" id="rt"></div><div class="ruby bottom" id="rb"></div><img id="frame" class="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Approved gold frame"></div><div class="buttons"><button class="active" data-mode="both">Combined</button><button data-mode="art">Artwork only</button><button data-mode="frame">Frame + rubies</button></div><p id="status">Preparing the composite…</p><p>The approved source PNGs are untouched. This remains a non-destructive visual test.</p><script>const cv=document.getElementById('art'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),rt=document.getElementById('rt'),rb=document.getElementById('rb'),status=document.getElementById('status');const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Local elliptical, softly feathered reconstruction; avoids visible rectangular seams. */function repair(cx,cy,rx,ry){const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);out.data.set(src.data);for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){const nx=(x-cx)/rx,ny=(y-cy)/ry,dist=Math.sqrt(nx*nx+ny*ny);if(dist>=1)continue;const blend=Math.min(1,Math.max(0,(1-dist)/.35));const sx1=Math.max(0,Math.round(cx-rx-16)),sx2=Math.min(w-1,Math.round(cx+rx+16));const t=Math.max(0,Math.min(1,(nx+1)/2));const t2=t*t*(3-2*t);const d=(y*w+x)*4,a=(y*w+sx1)*4,b=(y*w+sx2)*4;for(let k=0;k<3;k++){const v=src.data[a+k]*(1-t2)+src.data[b+k]*t2;out.data[d+k]=Math.round(src.data[d+k]*(1-blend)+v*blend)}}}ctx.putImageData(out,0,0)}repair(w*.5,h*.038,w*.087,h*.065);repair(w*.5,h*.963,w*.089,h*.065);/* Mask the unwanted outer perimeter of the original artwork, keeping the artwork beneath the gold ornament intact. */ctx.save();ctx.globalCompositeOperation='destination-in';ctx.beginPath();const insetX=w*.041,insetTop=h*.020,insetBottom=h*.958;ctx.roundRect(insetX,insetTop,w-2*insetX,insetBottom-insetTop,Math.min(w*.055,h*.035));ctx.fill();ctx.restore();status.textContent='Dragon artwork loaded. Gold frame over black outer backing; both rubies preserved at v9 positions.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';frame.onerror=()=>status.textContent='Could not load gold frame PNG.';document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{let m=b.dataset.mode;cv.style.opacity=m==='frame'?0:1;frame.style.opacity=m==='art'?0:1;rt.style.opacity=rb.style.opacity=m==='art'?0:1;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}));</script></body></html>
