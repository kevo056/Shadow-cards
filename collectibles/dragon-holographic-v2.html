<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Story Forge — Dragon Holographic v2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#4b211d,#100d13 75%);color:#fff3e9;font:15px system-ui;min-height:100dvh;text-align:center;padding:24px 12px}h1{font-size:22px;margin:0 0 7px}p{font-size:13px;opacity:.8}.stage{perspective:850px;touch-action:none;padding:20px 0}.card{width:min(84vw,380px);aspect-ratio:1024/1516;position:relative;margin:auto;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-radius:13px;box-shadow:0 25px 40px #0009;will-change:transform;overflow:hidden;touch-action:none;background:#000}.card canvas,.card .frame{position:absolute;top:0;left:0;width:100%;height:101.3193%;object-fit:fill;pointer-events:none}.frame{z-index:4}.ruby{z-index:5;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#ffb4a0 0%,#f83135 16%,#b70018 43%,#66000b 72%,#250006 100%);box-shadow:inset 0 0 2px 1px #40000b,0 0 3px #ff553b;pointer-events:none}.ruby:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#ff9a80 0 25%,#cb0920 26% 48%,#75000c 49% 74%,#ff3640 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.88}.top{top:3.5969%}.bottom{top:93.8216%;width:6.65%}.foil{display:none;position:absolute;inset:0;pointer-events:none;background:
linear-gradient(var(--angle,125deg),transparent 0%,rgba(255,209,88,.14) 18%,rgba(255,236,145,.52) 31%,rgba(255,255,238,1) 39%,rgba(255,225,130,.42) 48%,transparent 55%),

repeating-linear-gradient(calc(var(--angle,125deg) + 24deg),transparent 0%,transparent 7.65%,rgba(255,248,209,.32) 7.84%,rgba(255,255,247,.98) 7.96%,rgba(255,238,167,.25) 8.18%,transparent 8.42%,transparent 16%);mix-blend-mode:screen;opacity:var(--glow,1);-webkit-mask-size:100% 100%;mask-size:100% 100%}.holo{display:none;position:absolute;inset:0;pointer-events:none;opacity:.9;mix-blend-mode:screen;background:linear-gradient(var(--holo-angle,110deg),transparent 0%,rgba(67,238,255,.20) 18%,rgba(91,105,255,.52) 34%,rgba(255,93,225,.62) 48%,rgba(74,239,219,.55) 62%,rgba(111,149,255,.29) 77%,transparent 100%),repeating-linear-gradient(calc(var(--holo-angle,110deg) + 65deg),transparent 0%,rgba(135,255,248,.12) 5%,transparent 11%);-webkit-mask-size:100% 100%;mask-size:100% 100%}.gold-glint{display:none;position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.65;background:linear-gradient(var(--glint-angle,120deg),transparent 37%,rgba(255,236,169,.12) 44%,rgba(255,255,230,.8) 49%,rgba(255,222,127,.22) 52%,transparent 59%);background-size:180% 180%;background-position:var(--glint-x,0%) 50%;-webkit-mask-size:100% 100%;mask-size:100% 100%}.soft-sweep{position:absolute;inset:-8% -25%;pointer-events:none;mix-blend-mode:screen;opacity:.62;background:linear-gradient(110deg,transparent 39%,rgba(174,239,255,.04) 44%,rgba(226,250,255,.25) 49%,rgba(255,255,255,.36) 50%,rgba(208,245,255,.18) 52%,transparent 60%);transform:translateX(-95%);animation:softpass 5.6s ease-in-out infinite}@keyframes softpass{0%,14%{transform:translateX(-95%)}70%,100%{transform:translateX(95%)}}@media(prefers-reduced-motion:reduce){.soft-sweep{animation:none;opacity:0}}.ember-orbs{display:none;position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent 15%,black 25% 75%,transparent 85%);mask-image:linear-gradient(90deg,transparent 15%,black 25% 75%,transparent 85%)}.ember-orbs i{position:absolute;width:var(--d,5px);height:var(--d,5px);left:var(--x);top:var(--y);border-radius:50%;background:radial-gradient(circle,rgba(255,235,164,1) 0%,rgba(255,116,39,.7) 36%,transparent 76%);box-shadow:0 0 9px 2px rgba(255,95,34,.42);opacity:0;animation:orb-drift var(--t,10s) linear infinite;animation-delay:var(--delay,0s)}@keyframes orb-drift{0%{opacity:0;transform:translate3d(0,9px,0) scale(.65)}18%{opacity:.68}60%{opacity:.9}88%{opacity:.56}100%{opacity:0;transform:translate3d(var(--dx,6px),-45px,0) scale(1.05)}}@media(prefers-reduced-motion:reduce){.ember-orbs i{animation:none;opacity:.18}}.card.ready .foil,.card.ready .holo,.card.ready .gold-glint,.card.ready .ember-orbs{display:block}.foil{z-index:6;opacity:.58}.holo{opacity:.33!important}.soft-sweep{opacity:.18!important}.gold-glint{opacity:.4!important}.gold-glint{z-index:7}.holo{z-index:2}.ember-orbs{z-index:3}.soft-sweep{z-index:8}.controls{margin:14px auto 0;max-width:340px;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:67%;accent-color:#d5b16e}button{border:1px solid #c6a66b;background:#2b1b1c;color:white;border-radius:9px;padding:9px 18px;margin-top:10px}</style></head><body><main><h1>Dragon • Rare Holographic Test v2</h1><p>Approved Dragon v11 composition with Mermaid v27 holographic effects. Drag to tilt.</p><div class="stage" id="stage"><div class="card" id="card"><canvas id="art" width="1024" height="1536"></canvas><div class="holo"></div><div class="ember-orbs" aria-hidden="true"><i style="--x:31%;--y:76%;--d:8px;--t:11s;--delay:-2s;--dx:9px"></i><i style="--x:64%;--y:66%;--d:7px;--t:13s;--delay:-7s;--dx:-8px"></i><i style="--x:41%;--y:53%;--d:6px;--t:9s;--delay:-4s;--dx:5px"></i><i style="--x:70%;--y:82%;--d:8px;--t:14s;--delay:-10s;--dx:-7px"></i><i style="--x:27%;--y:46%;--d:6px;--t:12s;--delay:-6s;--dx:7px"></i><i style="--x:58%;--y:89%;--d:7px;--t:15s;--delay:-1s;--dx:-5px"></i></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Approved gold frame"><div class="ruby top"></div><div class="ruby bottom"></div><div class="foil"></div><div class="gold-glint"></div><div class="soft-sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status">Loading artwork…</p></main><script>const cv=document.getElementById('art'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),rt=document.querySelector('.ruby.top'),rb=document.querySelector('.ruby.bottom'),status=document.getElementById('status');const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Local elliptical, softly feathered reconstruction; avoids visible rectangular seams. */function repair(cx,cy,rx,ry){const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);out.data.set(src.data);for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){const nx=(x-cx)/rx,ny=(y-cy)/ry,dist=Math.sqrt(nx*nx+ny*ny);if(dist>=1)continue;const blend=Math.min(1,Math.max(0,(1-dist)/.35));const sx1=Math.max(0,Math.round(cx-rx-16)),sx2=Math.min(w-1,Math.round(cx+rx+16));const t=Math.max(0,Math.min(1,(nx+1)/2));const t2=t*t*(3-2*t);const d=(y*w+x)*4,a=(y*w+sx1)*4,b=(y*w+sx2)*4;for(let k=0;k<3;k++){const v=src.data[a+k]*(1-t2)+src.data[b+k]*t2;out.data[d+k]=Math.round(src.data[d+k]*(1-blend)+v*blend)}}}ctx.putImageData(out,0,0)}repair(w*.5,h*.038,w*.087,h*.065);repair(w*.5,h*.963,w*.089,h*.065);/* Mask the unwanted outer perimeter of the original artwork, keeping the artwork beneath the gold ornament intact. */ctx.save();ctx.globalCompositeOperation='destination-in';ctx.beginPath();const insetX=w*.041,insetTop=h*.020,insetBottom=h*.958;ctx.roundRect(insetX,insetTop,w-2*insetX,insetBottom-insetTop,Math.min(w*.055,h*.035));ctx.fill();ctx.restore();status.textContent='Dragon artwork loaded. Gold frame over black outer backing; both rubies preserved at v9 positions.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';frame.onerror=()=>status.textContent='Could not load gold frame PNG.';(()=>{const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');let down=false;function update(){const x=+v.value,y=+h.value;card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--angle',(90+y*3.6-x*2.1)+'deg');card.style.setProperty('--holo-angle',(115-y*4+x*2.5)+'deg');card.style.setProperty('--left-y',(50-x*1.65+y*.6)+'%');card.style.setProperty('--right-y',(50+x*1.65-y*.6)+'%');card.style.setProperty('--left-x',(8+y*.34)+'%');card.style.setProperty('--right-x',(92+y*.34)+'%');card.style.setProperty('--glow',String(1));card.style.setProperty('--glint-angle',(115+y*2-x)+'deg');card.style.setProperty('--glint-x',(50+y*2)+'%');status.textContent='Tilt: '+x+'° / '+y+'°'}function move(e){if(!down)return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.value=Math.round(Math.max(-22,Math.min(22,x*44)));v.value=Math.round(Math.max(-22,Math.min(22,-y*44)));update()}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);move(e)});stage.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=0;h.value=0;update()});const foil=card.querySelector('.foil');
function masks(){try{const c=document.createElement('canvas');c.width=384;c.height=576;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frame,0,0,384,576);const p=x.getImageData(0,0,384,576);for(let i=0;i<p.data.length;i+=4){const r=p.data[i],g=p.data[i+1],b=p.data[i+2],a=p.data[i+3];p.data[i]=p.data[i+1]=p.data[i+2]=255;p.data[i+3]=a&&r>75&&g>38&&r>g*1.15&&g>b*1.1?a:0}x.putImageData(p,0,0);const url='url("'+c.toDataURL()+'")';for(const el of [card.querySelector('.foil'),card.querySelector('.gold-glint')]){el.style.webkitMaskImage=url;el.style.maskImage=url}}catch(e){console.warn('Gold foil mask',e)}try{const c=document.createElement('canvas');c.width=384;c.height=576;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(cv,0,0,384,576);const p=x.getImageData(0,0,384,576),o=x.createImageData(384,576);for(let y=0;y<576;y++)for(let xx=0;xx<384;xx++){const i=(y*384+xx)*4,r=p.data[i],g=p.data[i+1],b=p.data[i+2],bright=Math.max(r,g,b),inside=xx>26&&xx<358&&y>32&&y<545;const alpha=inside&&bright>65?Math.round(Math.min(205,(bright-65)*2.5)):0;o.data[i]=o.data[i+1]=o.data[i+2]=255;o.data[i+3]=alpha}x.putImageData(o,0,0);const url='url("'+c.toDataURL()+'")';for(const el of [card.querySelector('.holo'),card.querySelector('.ember-orbs')]){el.style.webkitMaskImage=url;el.style.maskImage=url}}catch(e){console.warn('Dragon silhouette mask',e)}}let artReady=false,frameReady=false;const oldOnload=img.onload;img.onload=()=>{oldOnload();artReady=true;prepare()};const oldFrameLoad=frame.onload;frame.onload=()=>{frameReady=true;prepare()};function prepare(){if(artReady&&frameReady){masks();card.classList.add('ready')}}if(img.complete&&img.naturalWidth&&!artReady){img.onload()}if(frame.complete&&frame.naturalWidth){frameReady=true;prepare()}update()})();</script></body></html>
