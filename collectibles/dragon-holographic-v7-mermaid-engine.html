top:var(--y);border-radius:50%;background:radial-gradient(circle,rgba(255,248,216,1) 0%,rgba(255,172,75,.7) 36%,transparent 76%);box-shadow:0 0 9px 2px rgba(255,118,47,.42);opacity:0;animation:orb-drift var(--t,10s) linear infinite;animation-delay:var(--delay,0s)}@keyframes orb-drift{0%{opacity:0;transform:translate3d(0,9px,0) scale(.65)}18%{opacity:.68}60%{opacity:.9}88%{opacity:.56}100%{opacity:0;transform:translate3d(var(--dx,6px),-45px,0) scale(1.05)}}@media(prefers-reduced-motion:reduce){.dragon-orbs i{animation:none;opacity:.18}}.controls{margin:14px auto 0;max-width:340px;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:67%;accent-color:#d5b16e}button{border:1px solid #c6a66b;background:#152a36;color:white;border-radius:9px;padding:9px 18px;margin-top:10px}.missing{padding:8px;color:#ffca9b;font-size:13px}.ruby{z-index:3;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#ffb4a0 0%,#f83135 16%,#b70018 43%,#66000b 72%,#250006 100%);box-shadow:inset 0 0 2px 1px #40000b,0 0 3px #ff553b;pointer-events:none}.ruby:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#ff9a80 0 25%,#cb0920 26% 48%,#75000c 49% 74%,#ff3640 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.88}.top{top:3.5969%}.bottom{top:93.8216%;width:6.65%}
.card .frame{z-index:4}.card .ruby{z-index:5}.card .holo{z-index:2}.card .dragon-orbs{z-index:3}.card .foil{z-index:6}.card .gold-glint{z-index:7}.card .soft-sweep{z-index:8}.card .dragon-orbs i{box-shadow:0 0 12px 3px rgba(255,140,53,.58)}</style></head><body><main class="wrap"><h1>Dragon • Rare Holographic v7</h1><p>Mermaid v27 effects: tilt-responsive hologram, gold foil, automatic glint and floating embers.</p><div class="stage" id="stage"><div class="card" id="card"><canvas id="art" width="1024" height="1536"></canvas><div class="holo"></div><div class="dragon-orbs" aria-hidden="true"><i style="--x:31%;--y:76%;--d:8px;--t:9s;--delay:-2s;--dx:5px"></i><i style="--x:64%;--y:66%;--d:7px;--t:10s;--delay:-3s;--dx:-6px"></i><i style="--x:41%;--y:53%;--d:6px;--t:11s;--delay:-4s;--dx:7px"></i><i style="--x:70%;--y:82%;--d:8px;--t:12s;--delay:-5s;--dx:-8px"></i><i style="--x:27%;--y:46%;--d:6px;--t:13s;--delay:-6s;--dx:9px"></i><i style="--x:58%;--y:89%;--d:7px;--t:14s;--delay:-7s;--dx:-5px"></i><i style="--x:48%;--y:73%;--d:7px;--t:9s;--delay:-8s;--dx:6px"></i><i style="--x:73%;--y:49%;--d:6px;--t:10s;--delay:-9s;--dx:-7px"></i><i style="--x:35%;--y:87%;--d:8px;--t:11s;--delay:-10s;--dx:8px"></i><i style="--x:55%;--y:61%;--d:5px;--t:12s;--delay:-11s;--dx:-9px"></i><i style="--x:22%;--y:71%;--d:6px;--t:13s;--delay:-12s;--dx:5px"></i></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Gold frame"><div class="ruby top"></div><div class="ruby bottom"></div><div class="foil"></div><div class="gold-glint"></div><div class="soft-sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status" aria-live="polite">Loading Dragon artwork…</p></main><script>const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Local elliptical, softly feathered reconstruction; avoids visible rectangular seams. */function repair(cx,cy,rx,ry){const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);out.data.set(src.data);for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){const nx=(x-cx)/rx,ny=(y-cy)/ry,dist=Math.sqrt(nx*nx+ny*ny);if(dist>=1)continue;const blend=Math.min(1,Math.max(0,(1-dist)/.35));const sx1=Math.max(0,Math.round(cx-rx-16)),sx2=Math.min(w-1,Math.round(cx+rx+16));const t=Math.max(0,Math.min(1,(nx+1)/2));const t2=t*t*(3-2*t);const d=(y*w+x)*4,a=(y*w+sx1)*4,b=(y*w+sx2)*4;for(let k=0;k<3;k++){const v=src.data[a+k]*(1-t2)+src.data[b+k]*t2;out.data[d+k]=Math.round(src.data[d+k]*(1-blend)+v*blend)}}}ctx.putImageData(out,0,0)}repair(w*.5,h*.038,w*.087,h*.065);repair(w*.5,h*.963,w*.089,h*.065);/* Mask the unwanted outer perimeter of the original artwork, keeping the artwork beneath the gold ornament intact. */ctx.save();ctx.globalCompositeOperation='destination-in';ctx.beginPath();const insetX=w*.041,insetTop=h*.020,insetBottom=h*.958;ctx.roundRect(insetX,insetTop,w-2*insetX,insetBottom-insetTop,Math.min(w*.055,h*.035));ctx.fill();ctx.restore();status.textContent='Dragon artwork loaded. Gold frame over black outer backing; both rubies preserved at v9 positions.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';

(()=>{const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');let down=false;function update(){const x=+v.value,y=+h.value;card.style.setProperty('--rx',x+'deg');card.style.setProperty('--ry',y+'deg');card.style.setProperty('--angle',(90+y*3.6-x*2.1)+'deg');card.style.setProperty('--holo-angle',(115-y*4+x*2.5)+'deg');card.style.setProperty('--left-y',(50-x*1.65+y*.6)+'%');card.style.setProperty('--right-y',(50+x*1.65-y*.6)+'%');card.style.setProperty('--left-x',(8+y*.34)+'%');card.style.setProperty('--right-x',(92+y*.34)+'%');card.style.setProperty('--glow',String(1));card.style.setProperty('--glint-angle',(115+y*2-x)+'deg');card.style.setProperty('--glint-x',(50+y*2)+'%');status.textContent='Tilt: '+x+'° / '+y+'°'}function move(e){if(!down)return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.value=Math.round(Math.max(-22,Math.min(22,x*44)));v.value=Math.round(Math.max(-22,Math.min(22,-y*44)));update()}stage.addEventListener('pointerdown',e=>{down=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}move(e)});stage.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>down=false);v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{v.value=0;h.value=0;update()});const art=document.getElementById('art'),foil=card.querySelector('.foil'),frame=document.getElementById('frame');
function buildGoldMask(){try{const c=document.createElement('canvas');c.width=384;c.height=576;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frame,0,0,384,576);const p=x.getImageData(0,0,384,576),d=p.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],bl=d[i+2],alpha=d[i+3];d[i]=d[i+1]=d[i+2]=255;d[i+3]=r>74&&g>40&&r-g>9&&g-bl>8&&r>bl*1.3?alpha:0}x.putImageData(p,0,0);const mask='url("'+c.toDataURL('image/png')+'")';foil.style.webkitMaskImage=mask;foil.style.maskImage=mask}catch(e){console.warn(e)}}
function buildOceanMask(){
 const holo=card.querySelector('.holo');
 try{
  const c=document.createElement('canvas');const w=384,h=576;c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(art,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h),p=data.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2];
   // Exclude ornate outer frame, warm gold, gemstones and dark central silhouette.
   const inside=x>32&&x<w-32&&y>32&&y<h-32;
   const cool=r>g*1.08&&r>b*1.13;
   const bright=Math.max(r,g,b);
   const darkFigure=bright<72;
   const amount=inside&&cool&&!darkFigure?Math.min(215,Math.max(0,(bright-55)*1.75)):0;
   p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=amount;
  }
  ctx.putImageData(data,0,0);
  const mask='url("'+c.toDataURL('image/png')+'")';
  holo.style.webkitMaskImage=mask;holo.style.maskImage=mask;
 }catch(e){holo.style.display='none';console.warn('Ocean hologram mask unavailable',e);}
}
function maskOrbsBehindMermaid(){
 // Use the existing PNG solely to prevent orbs appearing over dark mermaid pixels.
 // No duplicate artwork or new image asset is created.
 try{
  const c=document.createElement('canvas'),w=384,h=576;c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(art,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h),p=data.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,r=p[i],g=p[i+1],b=p[i+2],bright=Math.max(r,g,b);
   const inside=x>35&&x<w-35&&y>35&&y<h-35;
   // Dark figure blocks the particles. Bright blue water remains visible.
   const water=Math.max(0,Math.min(1,(bright-48)/55));
   const cool=Math.max(0,Math.min(1,(r-b+8)/45));
   const alpha=inside?Math.round(255*water*(.45+.55*cool)):0;
   p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=alpha;
  }
  ctx.putImageData(data,0,0);
  const orbs=card.querySelector('.dragon-orbs');
  const mask='url("'+c.toDataURL('image/png')+'")';
  orbs.style.webkitMaskImage=mask;orbs.style.maskImage=mask;
  orbs.style.webkitMaskSize='100% 100%';orbs.style.maskSize='100% 100%';
 }catch(e){console.warn('Orb depth mask unavailable; keep v26 particles',e);}
}
function prepareMasks(){buildGoldMask();buildOceanMask();maskOrbsBehindMermaid();const glint=card.querySelector('.gold-glint');glint.style.webkitMaskImage=foil.style.webkitMaskImage;glint.style.maskImage=foil.style.maskImage;}
let readyArt=false,readyFrame=false;function ready(){if(readyArt&&readyFrame)prepareMasks()}const originalLoad=img.onload;img.onload=()=>{originalLoad();readyArt=true;ready()};frame.addEventListener('load',()=>{readyFrame=true;ready()},{once:true});if(img.complete&&img.naturalWidth)img.onload();if(frame.complete&&frame.naturalWidth){readyFrame=true;ready()}update()})();
