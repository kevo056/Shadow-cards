<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phoenix • Rare Holographic v4 | Story Forge</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#49351b,#0e0d10 75%);color:#f7e9c7;font:16px system-ui,sans-serif;display:grid;place-items:center}.wrap{width:min(100%,540px);padding:20px;text-align:center}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;color:#d9c9ad}.stage{perspective:850px;padding:22px 0;touch-action:none}.card{position:relative;margin:auto;width:min(82vw,355px);aspect-ratio:1024/1536;overflow:hidden;border-radius:14px;background:#000;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;box-shadow:0 25px 40px #0009;touch-action:none;will-change:transform}.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.art{z-index:1}.bottom-black{position:absolute;z-index:2;top:92.1%;bottom:0;left:0;right:0;background:#000;pointer-events:none}.frame{z-index:3}.controls{max-width:340px;margin:12px auto;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:65%;accent-color:#cfa454}button{background:#241c13;border:1px solid #bd9653;border-radius:8px;color:#f7e9c7;padding:9px 18px}#status{min-height:20px}
.gem{z-index:5;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#fffbd3 0%,#ffe968 16%,#e6a914 43%,#96600a 72%,#422904 100%);box-shadow:inset 0 0 2px 1px #62400a,0 0 4px #ffe17a;pointer-events:none}.gem:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#fff6ba 0 25%,#f6cc37 26% 48%,#b7790d 49% 74%,#ffec76 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.92}.gem.top{top:3.5969%}.gem.bottom{top:93.8216%;width:6.65%}.card{isolation:isolate}.holo{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:.64;mix-blend-mode:screen;background:linear-gradient(var(--holo-angle,115deg),transparent 3%,rgba(255,238,160,.10) 18%,rgba(255,239,170,.49) 34%,rgba(246,191,255,.49) 47%,rgba(148,234,255,.40) 59%,rgba(255,226,112,.39) 72%,transparent 96%);-webkit-mask-image:linear-gradient(to bottom,transparent 3%,#000 14%,#000 82%,transparent 94%);mask-image:linear-gradient(to bottom,transparent 3%,#000 14%,#000 82%,transparent 94%)}.gold-dust{position:absolute;z-index:2;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}.gold-dust i{position:absolute;left:var(--x);top:var(--y);width:var(--s,4px);height:var(--s,4px);border-radius:50%;background:radial-gradient(circle,#fff8d2 0%,#f4c94d 45%,transparent 78%);box-shadow:0 0 9px 2px #f6b94377;animation:rise var(--t,8s) linear infinite;animation-delay:var(--delay,0s)}@keyframes rise{0%{transform:translateY(12px) scale(.7);opacity:0}20%{opacity:.7}75%{opacity:.5}100%{transform:translateY(-50px) scale(1.1);opacity:0}}.foil{position:absolute;z-index:6;inset:0 auto auto 0;width:100%;height:100%;pointer-events:none;opacity:var(--foil-opacity,.43);mix-blend-mode:screen;background:linear-gradient(var(--angle,125deg),transparent 0%,#ffe49e44 22%,#fff7cebb 42%,#fffefaee 49%,#ffd56966 58%,transparent 76%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;transform:translateZ(0);backface-visibility:hidden}.sweep{position:absolute;z-index:7;inset:-8% -35%;pointer-events:none;mix-blend-mode:screen;opacity:.19;background:linear-gradient(110deg,transparent 43%,#fff8d066 49%,#ffffffbb 50%,#ffefbb55 52%,transparent 58%);animation:sweep 6s ease-in-out infinite}@keyframes sweep{0%,15%{transform:translateX(-85%)}75%,100%{transform:translateX(85%)}}@media(prefers-reduced-motion:reduce){.gold-dust i,.sweep{animation:none}}
/* v4 experimental overlay -- preserve frame art and both original gems */
.holo{opacity:var(--holo-opacity,.58);background:linear-gradient(var(--holo-angle,115deg),transparent 4%,rgba(255,237,168,.05) 18%,rgba(245,208,135,.18) 31%,rgba(217,157,248,.42) 43%,rgba(137,216,255,.43) 55%,rgba(255,218,150,.26) 68%,transparent 91%);-webkit-mask-image:none;mask-image:none;}
.prism{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:.68;mix-blend-mode:screen;background:radial-gradient(ellipse 65% 24% at var(--beamx,50%) var(--beamy,45%),rgba(149,225,255,.34),rgba(247,159,255,.25) 35%,rgba(255,215,149,.16) 65%,transparent 100%)}
.gold-dust{opacity:.58}
.foil{opacity:var(--foil-opacity,.23)}
.sweep{opacity:.12;animation-duration:10s}
.card:not(.fx-ready) .holo,.card:not(.fx-ready) .prism,.card:not(.fx-ready) .gold-dust{opacity:0!important}

/* Geometry repair: the original gold frame and Phoenix asset use a native 1024 x 1536
   canvas. Both now occupy precisely the same card coordinates at every tilt.
   The decorated frame is a separate uncut overlay; artwork and prism cannot
   bleed outside the trim's inner opening. */
.card{aspect-ratio:2/3}
.card img{width:100%;height:100%}
.art,.holo,.prism,.gold-dust{clip-path:inset(4.15% 4.15% 4.15% 4.15% round 11px)}
.frame{clip-path:none;object-fit:fill}
</style></head><body><main class="wrap"><h1>Phoenix • Rare Holographic v4</h1><p>Experimental v4 • Tilt-responsive inner holographic color • Softer frame foil • True-black Phoenix protected</p><div class="stage" id="stage"><div class="card" id="card"><img class="art" id="art" src="../Shadow%20Phoenix%20Over%20the%20Golden%20City%20(1).png" alt="Approved true-black cutout Phoenix artwork"><div class="holo"></div><div class="prism" aria-hidden="true"></div><div class="gold-dust" aria-hidden="true"><i style="--x:28%;--y:77%;--s:5px;--t:9s;--delay:-2s"></i><i style="--x:65%;--y:63%;--s:4px;--t:11s;--delay:-6s"></i><i style="--x:40%;--y:48%;--s:3px;--t:8s;--delay:-4s"></i><i style="--x:72%;--y:82%;--s:5px;--t:12s;--delay:-9s"></i><i style="--x:34%;--y:66%;--s:4px;--t:10s;--delay:-7s"></i><i style="--x:56%;--y:89%;--s:3px;--t:13s;--delay:-3s"></i></div><div class="bottom-black" aria-hidden="true"></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Gold card frame"><div class="gem top" aria-label="Top golden gemstone"></div><div class="gem bottom" aria-label="Bottom golden gemstone"></div><div class="foil" id="foil"></div><div class="sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status">Loading artwork and frame…</p></main><script>
const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');function update(){card.style.setProperty('--holo-angle',(115+Number(h.value)*2.3)+'deg');card.style.setProperty('--angle',(125+Number(h.value)*2.8)+'deg');card.style.setProperty('--foil-opacity',String(.19+Math.abs(Number(h.value))/170));card.style.setProperty('--holo-opacity',String(.52+Math.abs(Number(h.value))/240));card.style.setProperty('--beamx',(50+Number(h.value)*1.10)+'%');card.style.setProperty('--beamy',(45-Number(v.value)*1.00)+'%');card.style.setProperty('--rx',v.value+'deg');card.style.setProperty('--ry',h.value+'deg')}v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').onclick=()=>{v.value=0;h.value=0;update()};const foil=document.getElementById('foil'),frameImg=document.getElementById('frame');const sweepEl=document.querySelector('.sweep');function maskGold(){try{const c=document.createElement('canvas');c.width=1024;c.height=1536;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frameImg,0,0,1024,1536);const p=x.getImageData(0,0,1024,1536),d=p.data;for(let y=0;y<1536;y++)for(let xx=0;xx<1024;xx++){const i=(y*1024+xx)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];const edge=xx<174||xx>849||y<165||y>1370;const gold=edge&&a>10&&r>68&&g>36&&r-g>8&&g-b>7&&r>b*1.24;d[i]=d[i+1]=d[i+2]=255;d[i+3]=gold?Math.round(Math.min(255,Math.max(145,(r-48)*4.1))*a/255):0}x.putImageData(p,0,0);const m='url("'+c.toDataURL('image/png')+'")';foil.style.webkitMaskImage=m;foil.style.maskImage=m;sweepEl.style.webkitMaskImage=m;sweepEl.style.maskImage=m}catch(e){foil.style.display='none';sweepEl.style.display='none';console.warn(e)}}frameImg.addEventListener('load',maskGold);if(frameImg.complete&&frameImg.naturalWidth)maskGold();update();let loaded=0;for(const img of [document.getElementById('art'),document.getElementById('frame')]){img.addEventListener('load',()=>{loaded++;if(loaded===2)status.textContent='Phoenix holographic v4 preview ready.'});img.addEventListener('error',()=>{status.textContent='An image failed to load; check its repository filename.'})}let down=false;stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!down)return;const r=card.getBoundingClientRect();h.value=Math.max(-22,Math.min(22,Math.round(((e.clientX-r.left)/r.width-.5)*44)));v.value=Math.max(-22,Math.min(22,Math.round((.5-(e.clientY-r.top)/r.height)*44)));update()});for(const type of ['pointerup','pointercancel'])stage.addEventListener(type,()=>down=false);

/* v4: generate an artwork-derived luminosity exclusion mask.
   Near-black cutout pixels receive ZERO holographic light.
   Both CSS -webkit-mask and standard mask are set for browser compatibility. */
(()=>{
 const artImg=document.getElementById('art');
 const layers=[document.querySelector('.holo'),document.querySelector('.prism'),document.querySelector('.gold-dust')];
 function installArtMask(){
   if(!artImg.complete||!artImg.naturalWidth)return;
   try{
     const c=document.createElement('canvas');c.width=512;c.height=768;
     const cx=c.getContext('2d',{willReadFrequently:true});
     cx.drawImage(artImg,0,0,c.width,c.height);
     const bitmap=cx.getImageData(0,0,c.width,c.height),p=bitmap.data;
     for(let i=0;i<p.length;i+=4){
       const r=p[i],g=p[i+1],b=p[i+2],a=p[i+3];
       const peak=Math.max(r,g,b),spread=peak-Math.min(r,g,b);
       // Protect pure black and dark neutral bird pixels. Colored landscape remains visible.
       let strength=Math.max(0,Math.min(1,(peak-30)/82));
       if(spread>28&&peak>45)strength=Math.max(strength,.9);
       p[i]=p[i+1]=p[i+2]=255;
       p[i+3]=Math.round(strength*a);
     }
     cx.putImageData(bitmap,0,0);
     const mask='url("'+c.toDataURL('image/png')+'")';
     for(const layer of layers){
       layer.style.webkitMaskImage=mask;layer.style.maskImage=mask;
       layer.style.webkitMaskSize='100% 100%';layer.style.maskSize='100% 100%';
       layer.style.webkitMaskRepeat='no-repeat';layer.style.maskRepeat='no-repeat';
     }
     card.classList.add('fx-ready');
   }catch(err){
     document.getElementById('status').textContent='Art protection unavailable: holo effects kept off.';
     console.warn('Phoenix cutout mask could not be created',err);
   }
 }
 artImg.addEventListener('load',installArtMask);
 if(artImg.complete&&artImg.naturalWidth)installArtMask();
})();
</script></body></html>
