<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon — Ruby Fit v5</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101015;color:#eee;font:15px system-ui;text-align:center;padding:20px 10px}h1{font-size:21px}p{color:#bbb;max-width:460px;margin:12px auto}.stage{width:min(92vw,430px);aspect-ratio:2/3;position:relative;background:#000;border-radius:13px;overflow:hidden;margin:18px auto;box-shadow:0 16px 50px #000}.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.frame{pointer-events:none}.ruby{z-index:3;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#ffb4a0 0%,#f83135 16%,#b70018 43%,#66000b 72%,#250006 100%);box-shadow:inset 0 0 2px 1px #40000b,0 0 3px #ff553b;pointer-events:none}.ruby:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#ff9a80 0 25%,#cb0920 26% 48%,#75000c 49% 74%,#ff3640 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.88}.top{top:3.55%}.bottom{top:94.0%}.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;color:#fff;background:#2c2c34;border:1px solid #666;border-radius:9px;padding:10px 12px}button.active{border-color:#edba62;background:#60421b}#status{color:#e7bf79}</style></head><body><h1>Dragon — Ruby Fit v5</h1><p>Larger rubies aligned to the centers of the upper and lower gold settings. Original artwork and frame remain unchanged.</p><div class="stage"><canvas id="art" width="1024" height="1536"></canvas><div class="ruby top" id="rt"></div><div class="ruby bottom" id="rb"></div><img id="frame" class="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Approved gold frame"></div><div class="buttons"><button class="active" data-mode="both">Combined</button><button data-mode="art">Artwork only</button><button data-mode="frame">Frame + rubies</button></div><p id="status">Preparing the composite…</p><p>The approved source PNGs are untouched. This remains a non-destructive visual test.</p><script>const cv=document.getElementById('art'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),rt=document.getElementById('rt'),rb=document.getElementById('rb'),status=document.getElementById('status');const img=new Image();img.onload=()=>{const w=cv.width,h=cv.height;ctx.drawImage(img,0,0,w,h);/* Feathered in-browser repair: blend neighboring scenery instead of creating a hard rectangular patch. */function repair(y0,y1,coreStart,coreEnd){const x0=Math.round(w*.425),x1=Math.round(w*.575),src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(x1-x0,y1-y0);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const t=(x-x0)/(x1-x0),a=(y*w+x)*4,d=((y-y0)*(x1-x0)+(x-x0))*4;const left=(y*w+Math.max(0,x0-8))*4,right=(y*w+Math.min(w-1,x1+8))*4;const side=t*t*(3-2*t);const edge=Math.min(1,(x-x0)/22,(x1-1-x)/22);const vertical=Math.min(1,(y-y0)/Math.max(1,coreStart-y0),(y1-1-y)/Math.max(1,y1-coreEnd));const mix=Math.max(0,Math.min(1,edge,vertical));for(let k=0;k<3;k++){const reconstructed=src.data[left+k]*(1-side)+src.data[right+k]*side;out.data[d+k]=Math.round(src.data[a+k]*(1-mix)+reconstructed*mix)}out.data[d+3]=255;}ctx.putImageData(out,x0,y0)}repair(0,Math.round(h*.105),Math.round(h*.016),Math.round(h*.086));repair(Math.round(h*.895),h,Math.round(h*.912),Math.round(h*.985));status.textContent='Dragon artwork loaded. Feathered repairs applied; rubies centered above gold settings.'};img.onerror=()=>status.textContent='Could not load Dragon PNG.';img.src='../CC90ED86-A87C-47AA-AB0E-B66013E98C8F.png';frame.onerror=()=>status.textContent='Could not load gold frame PNG.';document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{let m=b.dataset.mode;cv.style.opacity=m==='frame'?0:1;frame.style.opacity=m==='art'?0:1;rt.style.opacity=rb.style.opacity=m==='art'?0:1;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}));</script></body></html>
