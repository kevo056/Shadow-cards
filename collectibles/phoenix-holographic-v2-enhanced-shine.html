.gem{z-index:5;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#fffbd3 0%,#ffe968 16%,#e6a914 43%,#96600a 72%,#422904 100%);box-shadow:inset 0 0 2px 1px #62400a,0 0 4px #ffe17a;pointer-events:none}.gem:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#fff6ba 0 25%,#f6cc37 26% 48%,#b7790d 49% 74%,#ffec76 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.92}.gem.top{top:3.5969%}.gem.bottom{top:93.8216%;width:6.65%}.card{isolation:isolate}.holo{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:.82;mix-blend-mode:screen;background:linear-gradient(var(--holo-angle,115deg),transparent 0%,rgba(255,244,180,.19) 12%,rgba(255,239,170,.70) 30%,rgba(245,167,255,.61) 46%,rgba(131,235,255,.58) 61%,rgba(255,218,98,.60) 76%,transparent 100%),repeating-linear-gradient(calc(var(--holo-angle,115deg) + 72deg),transparent 0%,rgba(255,246,203,.13) 4%,rgba(154,245,255,.16) 6%,transparent 11%);-webkit-mask-image:linear-gradient(to bottom,transparent 1%,#000 8%,#000 89%,transparent 97%);mask-image:linear-gradient(to bottom,transparent 1%,#000 8%,#000 89%,transparent 97%)}.gold-dust{position:absolute;z-index:2;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}.gold-dust i{position:absolute;left:var(--x);top:var(--y);width:var(--s,4px);height:var(--s,4px);border-radius:50%;background:radial-gradient(circle,#fff8d2 0%,#f4c94d 45%,transparent 78%);box-shadow:0 0 9px 2px #f6b94377;animation:rise var(--t,8s) linear infinite;animation-delay:var(--delay,0s)}@keyframes rise{0%{transform:translateY(12px) scale(.7);opacity:0}20%{opacity:.7}75%{opacity:.5}100%{transform:translateY(-50px) scale(1.1);opacity:0}}.foil{position:absolute;z-index:6;inset:0 auto auto 0;width:100%;height:101.3193%;pointer-events:none;opacity:var(--foil-opacity,.58);mix-blend-mode:screen;background:linear-gradient(var(--angle,125deg),transparent 0%,#ffe49e66 20%,#fff7cee8 40%,#fffefaff 49%,#ffd569a8 60%,transparent 78%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;transform:translateZ(0);backface-visibility:hidden}.sweep{position:absolute;z-index:7;inset:-8% -35%;pointer-events:none;mix-blend-mode:screen;opacity:.31;background:linear-gradient(110deg,transparent 43%,#fff8d066 49%,#ffffffbb 50%,#ffefbb55 52%,transparent 58%);animation:sweep 6s ease-in-out infinite}@keyframes sweep{0%,15%{transform:translateX(-85%)}75%,100%{transform:translateX(85%)}}@media(prefers-reduced-motion:reduce){.gold-dust i,.sweep{animation:none}}</style></head><body><main class="wrap"><h1>Phoenix • Rare Holographic v2</h1><p>Approved Phoenix artwork • Enhanced golden foil & vivid holographic reflections • Golden gemstones</p><div class="stage" id="stage"><div class="card" id="card"><img class="art" id="art" src="../307C79AB-CA10-439F-9FAF-47BCA7526F9A.png" alt="Approved golden Phoenix artwork"><div class="holo"></div><div class="gold-dust" aria-hidden="true"><i style="--x:28%;--y:77%;--s:5px;--t:9s;--delay:-2s"></i><i style="--x:65%;--y:63%;--s:4px;--t:11s;--delay:-6s"></i><i style="--x:40%;--y:48%;--s:3px;--t:8s;--delay:-4s"></i><i style="--x:72%;--y:82%;--s:5px;--t:12s;--delay:-9s"></i><i style="--x:34%;--y:66%;--s:4px;--t:10s;--delay:-7s"></i><i style="--x:56%;--y:89%;--s:3px;--t:13s;--delay:-3s"></i></div><div class="bottom-black" aria-hidden="true"></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Gold card frame"><div class="gem top" aria-label="Top golden gemstone"></div><div class="gem bottom" aria-label="Bottom golden gemstone"></div><div class="foil" id="foil"></div><div class="sweep"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');function update(){card.style.setProperty('--holo-angle',(115+Number(h.value)*2.3)+'deg');card.style.setProperty('--angle',(125+Number(h.value)*2.8)+'deg');card.style.setProperty('--foil-opacity',String(.53+Math.abs(Number(h.value))/125));card.style.setProperty('--rx',v.value+'deg');card.style.setProperty('--ry',h.value+'deg')}v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').onclick=()=>{v.value=0;h.value=0;update()};const foil=document.getElementById('foil'),frameImg=document.getElementById('frame');function maskGold(){try{const c=document.createElement('canvas');c.width=1024;c.height=1536;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(frameImg,0,0,1024,1536);const p=x.getImageData(0,0,1024,1536),d=p.data;for(let y=0;y<1536;y++)for(let xx=0;xx<1024;xx++){const i=(y*1024+xx)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];const edge=xx<174||xx>849||y<165||y>1370;const gold=edge&&a>10&&r>68&&g>36&&r-g>8&&g-b>7&&r>b*1.24;d[i]=d[i+1]=d[i+2]=255;d[i+3]=gold?Math.round(Math.min(255,Math.max(145,(r-48)*4.1))*a/255):0}x.putImageData(p,0,0);const m='url("'+c.toDataURL('image/png')+'")';foil.style.webkitMaskImage=m;foil.style.maskImage=m}catch(e){foil.style.display='none';console.warn(e)}}frameImg.addEventListener('load',maskGold);if(frameImg.complete&&frameImg.naturalWidth)maskGold();let loaded=0;for(const img of [document.getElementById('art'),document.getElementById('frame')]){img.addEventListener('load',()=>{loaded++;if(loaded===2)status.textContent='Phoenix holographic v2 preview ready.'});img.addEventListener('error',()=>{status.textContent='An image failed to load; check its repository filename.'})}let down=false;stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!down)return;const r=card.getBoundingClientRect();h.value=Math.max(-22,Math.min(22,Math.round(((e.clientX-r.left)/r.width-.5)*44)));v.value=Math.max(-22,Math.min(22,Math.round((.5-(e.clientY-r.top)/r.height)*44)));update()});for(const type of ['pointerup','pointercancel'])stage.addEventListener(type,()=>down=false);
