<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phoenix • Standard v2 | Story Forge</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#49351b,#0e0d10 75%);color:#f7e9c7;font:16px system-ui,sans-serif;display:grid;place-items:center}.wrap{width:min(100%,540px);padding:20px;text-align:center}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;color:#d9c9ad}.stage{perspective:850px;padding:22px 0;touch-action:none}.card{position:relative;margin:auto;width:min(82vw,355px);aspect-ratio:1024/1516;overflow:hidden;border-radius:14px;background:#000;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;box-shadow:0 25px 40px #0009;touch-action:none;will-change:transform}.card img{position:absolute;left:0;top:0;width:100%;height:101.3193%;object-fit:fill;pointer-events:none}.art{z-index:1}.bottom-black{position:absolute;z-index:2;top:92.1%;bottom:0;left:0;right:0;background:#000;pointer-events:none}.frame{z-index:3}.controls{max-width:340px;margin:12px auto;text-align:left}.controls label{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0}.controls input{width:65%;accent-color:#cfa454}button{background:#241c13;border:1px solid #bd9653;border-radius:8px;color:#f7e9c7;padding:9px 18px}#status{min-height:20px}
.gem{z-index:5;position:absolute;left:50%;width:6.15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 25%,#fffbd3 0%,#ffe968 16%,#e6a914 43%,#96600a 72%,#422904 100%);box-shadow:inset 0 0 2px 1px #62400a,0 0 4px #ffe17a;pointer-events:none}.gem:before{content:'';position:absolute;inset:14%;background:linear-gradient(140deg,#fff6ba 0 25%,#f6cc37 26% 48%,#b7790d 49% 74%,#ffec76 75%);clip-path:polygon(50% 0,90% 30%,80% 76%,50% 100%,18% 72%,10% 28%);opacity:.92}.gem.top{top:3.5969%}.gem.bottom{top:93.8216%;width:6.65%}</style></head><body><main class="wrap"><h1>Phoenix • Standard v2</h1><p>Approved solid-black cutout artwork • Separate gold frame • Golden gemstones aligned to Dragon v24</p><div class="stage" id="stage"><div class="card" id="card"><img class="art" id="art" src="../Shadow%20Phoenix%20Over%20the%20Golden%20City%20(1).png" alt="Approved true-black cutout Phoenix artwork"><div class="bottom-black" aria-hidden="true"></div><img class="frame" id="frame" src="../AF2C4600-A57F-4B3C-8599-5641C23128FE.png" alt="Gold card frame"><div class="gem top" aria-label="Top golden gemstone"></div><div class="gem bottom" aria-label="Bottom golden gemstone"></div></div></div><div class="controls"><label>Vertical tilt <input id="vertical" type="range" min="-22" max="22" value="0"></label><label>Horizontal tilt <input id="horizontal" type="range" min="-22" max="22" value="0"></label></div><button id="reset">Reset tilt</button><p id="status">Loading artwork and frame…</p></main><script>
const card=document.getElementById('card'),stage=document.getElementById('stage'),v=document.getElementById('vertical'),h=document.getElementById('horizontal'),status=document.getElementById('status');function update(){card.style.setProperty('--rx',v.value+'deg');card.style.setProperty('--ry',h.value+'deg')}v.addEventListener('input',update);h.addEventListener('input',update);document.getElementById('reset').onclick=()=>{v.value=0;h.value=0;update()};let loaded=0;for(const img of [document.getElementById('art'),document.getElementById('frame')]){img.addEventListener('load',()=>{loaded++;if(loaded===2)status.textContent='Standard Phoenix preview ready.'});img.addEventListener('error',()=>{status.textContent='An image failed to load; check its repository filename.'})}let down=false;stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!down)return;const r=card.getBoundingClientRect();h.value=Math.max(-22,Math.min(22,Math.round(((e.clientX-r.left)/r.width-.5)*44)));v.value=Math.max(-22,Math.min(22,Math.round((.5-(e.clientY-r.top)/r.height)*44)));update()});for(const type of ['pointerup','pointercancel'])stage.addEventListener(type,()=>down=false);
</script></body></html>
